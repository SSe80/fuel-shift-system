name: Unpack project archive

on:
  push:
    branches: ["unpack-project"]

permissions:
  contents: write

jobs:
  unpack:
    if: ${{ !hashFiles('public/index.html') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack archive
        run: |
          unzip -o fuel_shift_system_supabase_cloudflare_v2.zip -d /tmp/project
          cp -a /tmp/project/fuel_shift_supabase_cloudflare_v2/. .
          rm -rf /tmp/project fuel_shift_system_supabase_cloudflare_v2.zip
      - name: Commit unpacked project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack fuel shift system project"
          git push

# trigger workflow
