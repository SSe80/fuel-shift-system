<style>
:root{color-scheme:light;--ink:#182230;--muted:#667085;--line:#dce5ef}
*{box-sizing:border-box}
body{margin:0;background:#f3f6fb;color:var(--ink);font-family:Inter,"Segoe UI",Arial,sans-serif}
.layout{display:flex;min-height:100vh}
.sidebar{width:244px;flex:0 0 244px;background:#fff;border-right:1px solid var(--line);padding:24px 14px}
.brand{display:flex;align-items:center;gap:10px;padding:0 9px 22px;border-bottom:1px solid var(--line)}
.mark{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:#fff7ed;border:1px solid #fed7aa;color:#b45309;font-weight:900}
.brand strong{display:block;font-size:12px;letter-spacing:.4px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:4px}
nav{display:grid;gap:5px;padding-top:17px}nav a{display:flex;align-items:center;gap:10px;padding:12px;border-radius:10px;text-decoration:none;color:#475467;font-size:13px}nav a.active,nav a:hover{background:#eff6ff;color:#1d4ed8}nav a span{width:22px;text-align:center}
main{flex:1;min-width:0;padding:32px}
.panel{max-width:850px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:0 5px 20px #0f172a08}
.eyebrow{color:#2563eb;font-size:11px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase}
h1{font-size:clamp(28px,4vw,38px);letter-spacing:-1px;margin:9px 0}
p{color:var(--muted);font-size:14px;line-height:1.65}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:10px;padding:12px 16px;font-size:13px;font-weight:750;text-decoration:none}
.primary{background:#2563eb;color:#fff}.secondary{background:#eff6ff;color:#1d4ed8}
@media(max-width:760px){.layout{display:block}.sidebar{width:100%;padding:12px}.brand{padding-bottom:12px}nav{display:flex;overflow-x:auto;padding-top:10px}nav a{white-space:nowrap}main{padding:18px 13px}.panel{padding:20px}}
</style>
</head>

</body>
