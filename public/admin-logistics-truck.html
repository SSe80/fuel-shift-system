<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f3f6fb">
<title>Truck | Admin Logistics</title>
<link rel="stylesheet" href="assets/style.css?v=20261011-popup2">

<style>
:root{color-scheme:light;--lg-ink:#182230;--lg-muted:#667085;--lg-line:#dce5ef}
*{box-sizing:border-box}
.logistics-layout{display:flex;min-height:100vh;background:#f3f6fb;color:var(--lg-ink)}
.logistics-sidebar{width:244px;flex:0 0 244px;background:#fff;border-right:1px solid var(--lg-line);padding:24px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.logistics-brand{display:flex;align-items:center;gap:10px;padding:0 9px 22px;border-bottom:1px solid var(--lg-line)}
.logistics-mark{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:#fff7ed;border:1px solid #fed7aa;color:#b45309;font-weight:900}
.logistics-brand strong{display:block;font-size:12px;letter-spacing:.4px}
.logistics-brand small{display:block;color:var(--lg-muted);font-size:11px;margin-top:4px}
.logistics-nav{display:grid;gap:5px;padding-top:17px}
.logistics-nav a{display:flex;align-items:center;gap:10px;padding:12px;border-radius:10px;text-decoration:none;color:#475467;font-size:13px}
.logistics-nav a:hover,.logistics-nav a.active{background:#eff6ff;color:#1d4ed8}
.logistics-nav a span{width:22px;text-align:center}.logistics-logout{width:100%;margin-top:auto;border:1px solid #fecaca;border-radius:9px;padding:10px 14px;background:#fff;color:#b91c1c;font-size:13px;font-weight:750;cursor:pointer}.logistics-logout:disabled{opacity:.6}.logistics-sidebar{display:flex;flex-direction:column}.logistics-nav{width:100%}
.logistics-main{min-width:0;flex:1}
.logistics-main .wrap{max-width:900px;margin:0 auto;padding:36px 28px}
.truck-panel{background:#fff;border:1px solid var(--lg-line);border-radius:16px;padding:28px;box-shadow:0 5px 20px #0f172a08}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.4px;color:#2563eb}
h1{font-size:clamp(28px,4vw,38px);margin:9px 0 10px;letter-spacing:-.8px}
p{font-size:14px;line-height:1.7;color:var(--lg-muted);max-width:650px}
.truck-primary{display:inline-flex;align-items:center;justify-content:center;margin-top:10px;border:0;border-radius:10px;padding:12px 16px;background:#2563eb;color:#fff;text-decoration:none;font-size:13px;font-weight:800}
.truck-primary:hover{background:#1d4ed8}
@media(max-width:760px){.logistics-layout{display:block}.logistics-sidebar{position:relative;width:100%;height:auto;padding:12px}.logistics-brand{padding-bottom:12px}.logistics-nav{display:flex;overflow-x:auto;padding-top:10px}.logistics-nav a{white-space:nowrap}.logistics-main .wrap{padding:22px 13px}.truck-panel{padding:20px}}
</style>
<script src="assets/logistics-auth.js?v=20261013-01"></script>
<style id="logistics-admin-theme">
/* Align Logistics with the main Admin panel: dark horizontal navigation, light workspace. */
body{background:#f7f9fc!important;color:#182230!important;font-family:Inter,"Segoe UI",Arial,sans-serif!important}
.logistics-layout{display:block!important;min-height:100vh;background:#f7f9fc!important}
.logistics-sidebar{position:relative!important;top:auto!important;width:100%!important;height:74px!important;min-height:74px!important;padding:0 18px!important;display:flex!important;flex-direction:row!important;align-items:center!important;gap:18px!important;background:#111827!important;color:#e5e7eb!important;border:0!important;border-bottom:1px solid #253047!important;box-shadow:0 4px 18px #10182818!important;overflow:visible!important}
.logistics-brand{flex:0 0 auto!important;padding:0!important;border:0!important;color:#f9fafb!important}.logistics-brand strong{color:#f9fafb!important;font-size:13px!important}.logistics-brand small{color:#9ca3af!important}.logistics-mark{background:#1f2937!important;border:1px solid #374151!important;color:#fbbf24!important}
.logistics-nav{flex:1 1 auto!important;min-width:0!important;display:flex!important;align-items:center!important;justify-content:center!important;gap:5px!important;padding:0!important;overflow-x:auto!important;scrollbar-width:none}.logistics-nav::-webkit-scrollbar{display:none}
.logistics-nav a{flex:0 0 auto!important;white-space:nowrap!important;color:#d1d5db!important;padding:12px 13px!important;border-radius:10px!important;font-size:14px!important}.logistics-nav a:hover,.logistics-nav a.active{background:#273449!important;color:#fff!important}
.logistics-logout{flex:0 0 auto!important;width:auto!important;margin:0!important;padding:11px 13px!important;background:#111827!important;border-color:#7f1d1d!important;color:#fecaca!important;white-space:nowrap}
.logistics-main{width:100%!important;min-width:0!important}.logistics-main .wrap{max-width:1180px!important;margin:0 auto!important;padding:28px 22px 44px!important;background:#f7f9fc!important}
.truck-panel{border-color:#e1e8f0!important;border-radius:16px!important;box-shadow:0 5px 20px #0f172a08!important}
@media(max-width:760px){.logistics-sidebar{height:64px!important;min-height:64px!important;padding:0 10px!important;gap:8px!important}.logistics-brand{display:none!important}.logistics-nav{justify-content:flex-start!important;gap:4px!important}.logistics-nav a{padding:11px!important;font-size:12px!important}.logistics-nav a span{display:none!important}.logistics-logout{padding:10px!important;font-size:12px!important}.logistics-main .wrap{padding:20px 15px 32px!important}}
@media(max-width:480px){.logistics-sidebar{height:58px!important;min-height:58px!important;padding:0 7px!important}.logistics-nav a{padding:10px!important;font-size:11px!important}.logistics-logout{padding:9px!important;font-size:11px!important}.logistics-main .wrap{padding:16px 12px 28px!important}}
</style>
</head>

</div>

</html>
