<style id="admin-attendant-details-style">
.admin-attendant-card{cursor:pointer;transition:transform .18s ease,box-shadow .18s ease}
.admin-attendant-card:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(15,23,42,.08)}
.admin-attendant-details-modal{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(15,23,42,.58)}
.admin-attendant-details-modal.open{display:flex}
.admin-attendant-details-backdrop{position:absolute;inset:0}
.admin-attendant-details-card{position:relative;width:min(620px,calc(100vw - 28px));max-height:88vh;display:flex;flex-direction:column;overflow:hidden;border:1px solid #dfe5ec;border-radius:18px;background:#fff;box-shadow:0 28px 80px rgba(15,23,42,.28)}
.admin-attendant-details-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 17px 12px;border-bottom:1px solid #e8edf2}
.admin-attendant-details-top h3{margin:0;font-size:18px;color:#182230}
.admin-attendant-details-close{width:34px;height:34px;border:1px solid #dfe5ec;border-radius:9px;background:#f8fafc;color:#344054;font-size:21px;line-height:1}
.admin-attendant-details-content{min-height:0;overflow:auto;padding:14px}
.admin-attendant-hero{display:flex;justify-content:space-between;gap:14px;padding:15px;border:1px solid #e2e8f0;border-radius:14px;background:#f8fafc}
.admin-attendant-hero h2{margin:3px 0 4px;font-size:22px;color:#16202b}
.admin-attendant-hero p{margin:0;color:#667085;font-size:12px}
.admin-attendant-status{align-self:flex-start;padding:5px 9px;border-radius:999px;font-size:9px;font-weight:900;letter-spacing:.08em;background:#ecfdf3;color:#087443}
.admin-attendant-status.inactive{background:#f2f4f7;color:#667085}
.admin-attendant-section{margin-top:12px;border:1px solid #e6ebf0;border-radius:14px;padding:12px}
.admin-attendant-section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:9px}
.admin-attendant-section-head span{font-size:10px;font-weight:900;letter-spacing:.12em;color:#344054}
.admin-attendant-section-head small{font-size:10px;color:#98a2b3}
.admin-attendant-metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.admin-attendant-metric{padding:10px;border-radius:10px;background:#f8fafc}
.admin-attendant-metric span{display:block;font-size:10px;color:#667085}
.admin-attendant-metric strong{display:block;margin-top:3px;font-size:15px;color:#17212b}
.admin-attendant-metric small{display:block;margin-top:2px;font-size:9px;color:#98a2b3}
.admin-attendant-shift{padding:10px 0;border-top:1px solid #edf0f3}
.admin-attendant-shift:first-child{border-top:0;padding-top:0}
.admin-attendant-shift-head{display:flex;justify-content:space-between;gap:10px}
.admin-attendant-shift-head strong{font-size:12px;color:#182230}
.admin-attendant-shift-head span{font-size:9px;font-weight:800;color:#087443}
.admin-attendant-shift p{margin:4px 0 0;font-size:10px;color:#667085;line-height:1.45}
.admin-attendant-shift-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:8px}
.admin-attendant-shift-grid div{padding:7px 8px;background:#f8fafc;border-radius:8px}
.admin-attendant-shift-grid span{display:block;font-size:8px;color:#98a2b3}
.admin-attendant-shift-grid b{display:block;margin-top:2px;font-size:10px;color:#344054}
@media(max-width:520px){.admin-attendant-metrics{grid-template-columns:1fr 1fr}.admin-attendant-shift-grid{grid-template-columns:1fr 1fr}}
