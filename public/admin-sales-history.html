<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sales History</title><link rel="stylesheet" href="assets/style.css?v=20261008-01"><style>
.admin-sales-history-page .admin-full-history-month-group{margin:0 0 16px;border:1px solid #4b83bd;border-radius:14px;background:#fff;overflow:hidden;box-shadow:0 2px 8px rgba(23,32,42,.04)}
.admin-sales-history-page .admin-full-history-month-head,.admin-sales-history-page .admin-full-history-dsr-head{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;border:0;background:#fff;color:#17202a;text-align:left;cursor:pointer}
.admin-sales-history-page .admin-full-history-month-head{min-height:64px}
.admin-sales-history-page .admin-full-history-month-head:hover,.admin-sales-history-page .admin-full-history-dsr-head:hover{background:#fafbfd}
.admin-sales-history-page .admin-full-history-month-title,.admin-sales-history-page .admin-full-history-dsr-title{display:flex;flex-direction:column;gap:3px;min-width:0}
.admin-sales-history-page .admin-full-history-month-title strong{font-size:15px}
.admin-sales-history-page .admin-full-history-month-right,.admin-sales-history-page .admin-full-history-dsr-right{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.admin-sales-history-page .admin-full-history-month-right small,.admin-sales-history-page .admin-full-history-dsr-right small{color:#8a949e;font-size:10px}
.admin-sales-history-page .admin-full-history-month-toggle,.admin-sales-history-page .admin-full-history-dsr-toggle{width:27px;height:27px;display:grid;place-items:center;border:1px solid #dce3ea;border-radius:8px;background:#f8fafc;color:#667085;font-size:16px;font-weight:800}
.admin-sales-history-page .admin-full-history-month-group.expanded>.admin-full-history-month-head .admin-full-history-month-toggle,.admin-sales-history-page .admin-full-history-dsr-group.expanded>.admin-full-history-dsr-head .admin-full-history-dsr-toggle{background:#eef4ff;color:#2563eb;border-color:#c7d7fe}
.admin-sales-history-page .admin-full-history-month-body{max-height:430px;overflow-y:auto;padding:12px;display:grid;gap:12px;background:#fcfdff;border-top:1px solid #edf1f4}
.admin-sales-history-page .admin-full-history-month-body[hidden],.admin-sales-history-page .admin-full-history-dsr-cards[hidden]{display:none}
.admin-sales-history-page .admin-full-history-dsr-group{border:1px solid #d8e1e9;border-radius:11px;background:#fff;overflow:hidden}
.admin-sales-history-page .admin-full-history-dsr-cards{max-height:330px;overflow-y:auto;padding:9px;display:grid;gap:9px;border-top:1px solid #edf1f5}
.admin-sales-history-page .admin-full-history-dsr-cards .admin-history-sale-minimized{margin:0}

.admin-sales-history-page .purchase-history-tools{display:grid!important;grid-template-columns:minmax(0,1fr) 150px auto!important;align-items:center!important;gap:9px!important;margin:0 0 14px!important;padding:9px!important;border:1px solid #e1e7ed!important;border-radius:14px!important;background:#f8fafc!important;box-sizing:border-box!important}
.admin-sales-history-page .purchase-history-search-wrap{position:relative;min-width:0}
.admin-sales-history-page .purchase-history-search-wrap>span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#7b8794;font-size:18px;line-height:1;pointer-events:none}
.admin-sales-history-page .purchase-history-tools input,.admin-sales-history-page .purchase-history-tools select,.admin-sales-history-page .purchase-history-tools button{box-sizing:border-box!important;width:100%!important;height:42px!important;min-height:42px!important;margin:0!important;border:1px solid #d5dde5!important;border-radius:10px!important;background:#fff!important;color:#344054!important;font:inherit!important;font-size:12px!important;font-weight:600!important}
.admin-sales-history-page .purchase-history-tools input{padding:0 12px 0 36px!important;outline:none!important}.admin-sales-history-page .purchase-history-tools input:focus{border-color:#4b83bd!important;box-shadow:0 0 0 3px rgba(75,131,189,.12)!important}
.admin-sales-history-page .purchase-history-tools select{padding:0 30px 0 11px!important;cursor:pointer!important}.admin-sales-history-page .purchase-history-tools button{padding:0 14px!important;display:flex!important;align-items:center!important;justify-content:center!important;gap:5px!important;background:#edf2f6!important;cursor:pointer!important}.admin-sales-history-page .purchase-history-tools button:hover{background:#e4ebf1!important}
@media(max-width:700px){.admin-sales-history-page .purchase-history-tools{grid-template-columns:minmax(0,1fr) 135px!important}}
@media(max-width:480px){.admin-sales-history-page .purchase-history-tools{grid-template-columns:1fr 1fr!important;gap:7px!important;padding:8px!important}.admin-sales-history-page .purchase-history-tools .purchase-history-search-wrap{grid-column:1/-1}.admin-sales-history-page .purchase-history-tools input,.admin-sales-history-page .purchase-history-tools select,.admin-sales-history-page .purchase-history-tools button{height:40px!important;min-height:40px!important}}
</style></head>
<body class="admin-shell admin-sales-page admin-sales-history-page" data-app-page="adminSalesHistory">
<button type="button" class="admin-sidebar-toggle" aria-label="Toggle admin navigation" aria-expanded="true" onclick="toggleAdminSidebar()">☰</button>
<aside class="admin-sidebar" aria-label="Admin navigation">
  <div class="admin-sidebar-brand"><span class="admin-sidebar-mark">FS</span><div><strong>Fuel Shift</strong><small>Admin Control</small></div></div>
  <nav class="admin-sidebar-nav">
    <a href="admin-dashboard.html" data-admin-nav="dashboard"><span>⌂</span><b>Dashboard</b></a>
    <a href="admin-purchases.html" data-admin-nav="purchases"><span>▣</span><b>Purchases</b></a>
    <a href="admin-sales.html" data-admin-nav="sales"><span>↗</span><b>Sales</b></a>
    <a href="admin-daily-report.html" data-admin-nav="daily-report"><span>▤</span><b>DSR</b></a>
    <a href="admin-settings.html" data-admin-nav="settings"><span>⚙</span><b>Settings</b></a>
  </nav>
  <button type="button" class="admin-sidebar-logout" onclick="logout()"><span>↪</span><b>Logout</b></button>
</aside>
<main class="wrap">
<header class="purchase-header"><div><span class="eyebrow">STATION CONTROL</span><h1>Sales History</h1><p class="muted">Previously confirmed shift sales.</p></div><a class="purchase-back" href="admin-sales.html">← Sales</a></header>
<section class="admin-sales-section sales-page-sections">
  <div class="purchase-section admin-sales-separated-section sales-history-section">
    <div class="admin-sales-section-heading">
      <div><span class="section-kicker">RECORDS</span><h2>Sales History</h2><p class="muted">Previously confirmed shift sales.</p></div>
      <span class="admin-sales-section-count" id="full-sales-history-count">0 confirmed</span>
    </div>
    <div class="purchase-history-tools sales-history-tools"><div class="purchase-history-search-wrap"><span aria-hidden="true">⌕</span><input id="full-sales-history-search" type="search" placeholder="Search dispenser, attendant or DSR…" oninput="filterAdminSalesHistoryPage()"></div><select id="full-sales-history-period" onchange="filterAdminSalesHistoryPage()" aria-label="Sales history date filter"><option value="all">All dates</option><option value="today">Today</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option></select><button type="button" class="purchase-history-refresh" onclick="refreshAdminSalesHistory()">↻ <span>Refresh</span></button></div>
    <div id="full-sales-history-status" class="page-status"></div>
    <div id="full-sales-history-list" class="admin-sales-list"></div>
  </div>
</section>
<div id="admin-sale-history-details" class="modal purchase-modal" aria-hidden="true">
  <div class="modal-backdrop" onclick="closeAdminSaleHistoryDetails()"></div>
  <div class="modal-card admin-sale-review-card takeover-details-modal">
    <div class="top"><div><span class="section-kicker">SHIFT HISTORY</span><h3>Shift Details</h3><p class="muted">View the complete confirmed sales record.</p></div>
      <div class="admin-sale-history-detail-actions"><button type="button" class="secondary admin-sale-history-download" id="admin-sale-history-download" onclick="downloadAdminSaleHistoryDetails(this.dataset.takeoverId)" title="Download PDF">⇩ PDF</button><button type="button" class="modal-close" onclick="closeAdminSaleHistoryDetails()">×</button></div>
    </div>
    <div id="admin-sale-history-details-content"></div>
  </div>
</div>
</main>
<script src="assets/app.js?v=20261008-03"></script><script src="assets/app-boot.js?v=20261005-02"></script>
</body></html>
