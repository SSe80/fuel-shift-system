<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DSR History</title><link rel="stylesheet" href="assets/style.css?v=20261005-20"><style>
.dsr-history-page .dsr-history-month{overflow:hidden;border:1px solid #e4e9ef;border-radius:14px;background:#fff;box-shadow:0 3px 12px rgba(16,24,40,.055);margin-bottom:10px}
.dsr-history-page .dsr-history-month-head{width:100%;min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px 11px 17px;border:0;background:#fff;color:#17202a;text-align:left;cursor:pointer}
.dsr-history-page .dsr-history-month-head:hover{background:#fafbfd}
.dsr-history-page .dsr-history-month-title{display:flex;flex-direction:column;gap:3px;min-width:0}
.dsr-history-page .dsr-history-month-title span{font-size:9px;letter-spacing:.1em;font-weight:800;color:#98a2b3}
.dsr-history-page .dsr-history-month-title strong{font-size:15px;line-height:1.2}
.dsr-history-page .dsr-history-month-right{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.dsr-history-page .dsr-history-month-right small{color:#8a949e;font-size:10px}
.dsr-history-page .dsr-history-month-toggle{width:27px;height:27px;display:grid;place-items:center;border:1px solid #dce3ea;border-radius:8px;background:#f8fafc;color:#667085;font-size:16px;font-weight:800}
.dsr-history-page .dsr-history-month.expanded .dsr-history-month-toggle{background:#eef4ff;color:#2563eb;border-color:#c7d7fe}
.dsr-history-page .dsr-history-month-body{padding:10px;border-top:1px solid #edf1f4;background:#fcfdff}
.dsr-history-page .dsr-history-month-body[hidden]{display:none}
</style></head>
<body class="admin-shell daily-report-page dsr-history-page" data-app-page="adminDsrHistory">
<button type="button" class="admin-sidebar-toggle" aria-label="Toggle admin navigation" aria-expanded="true" onclick="toggleAdminSidebar()">☰</button>
<aside class="admin-sidebar" aria-label="Admin navigation">
  <div class="admin-sidebar-brand"><span class="admin-sidebar-mark">FS</span><div><strong>Fuel Shift</strong><small>Admin Control</small></div></div>
  <nav class="admin-sidebar-nav">
    <a href="admin-dashboard.html" data-admin-nav="dashboard"><span>⌂</span><b>Dashboard</b></a>
    <a href="admin-purchases.html" data-admin-nav="purchases"><span>▣</span><b>Purchases</b></a>
    <a href="admin-sales.html" data-admin-nav="sales"><span>↗</span><b>Sales</b></a>
    <a href="admin-daily-report.html" data-admin-nav="daily-report"><span>▤</span><b>DSR</b></a>
    <a href="admin-settings.html" data-admin-nav="settings"><span>⚙</span><b>Settings</b></a>
  </nav>
  <button type="button" class="admin-sidebar-logout" onclick="logout()"><span>↪</span><b>Logout</b></button>
</aside>
<main class="wrap admin-daily-report-page">
<header class="purchase-header daily-report-header"><div><span class="eyebrow">REPORTING</span><h1>DSR History</h1><p class="muted">Each confirmed date is shown as a compact card.</p></div><a class="purchase-back" href="admin-daily-report.html">← DSR</a></header>
<section class="purchase-section daily-section daily-history-section">
  <div class="purchase-section-head daily-section-head"><div><span class="section-kicker daily-kicker">DSR HISTORY</span><h2>DSR history</h2><p class="muted">Each confirmed date is shown as a compact card. Expand details or open the full report.</p></div></div>
  <div id="daily-report-date-cards" class="daily-report-date-cards"></div>
</section>
<div id="toast" class="toast"></div>
</main>
<script src="assets/app.js?v=20261006-07"></script>
<script>
(function(){
 async function load(){
  const box=document.getElementById('daily-report-date-cards'); if(!box)return;
  try{
   const me=await currentUser(); if(me.role!=='admin')return location.href='admin-login.html';
   const rows=await api('/api/reports/daily/confirmations');
   const confirmed=(Array.isArray(rows)?rows:[]).filter(x=>x.status==='confirmed').sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
   if(!confirmed.length){box.innerHTML='<div class="card">No confirmed DSR reports found.</div>';return;}
   const monthGroups={};
   confirmed.forEach(item=>{
    const date=String(item.date||'');
    const monthKey=/^\\d{4}-\\d{2}/.test(date)?date.slice(0,7):'unknown';
    (monthGroups[monthKey]||(monthGroups[monthKey]=[])).push(item);
   });
   const monthKeys=Object.keys(monthGroups).sort((a,b)=>b.localeCompare(a));
   box.innerHTML=monthKeys.map(monthKey=>{
    const monthDate=new Date(monthKey+'-01T00:00:00');
    const monthLabel=Number.isNaN(monthDate.getTime())?monthKey:monthDate.toLocaleDateString(undefined,{month:'long',year:'numeric'});
    const items=monthGroups[monthKey];
    return '<section class="dsr-history-month" data-month-key="'+monthKey+'">'+
      '<button type="button" class="dsr-history-month-head" onclick="toggleDsrMonth(this)" aria-expanded="false">'+
       '<span class="dsr-history-month-title"><span>MONTH</span><strong>'+monthLabel+'</strong></span>'+
       '<span class="dsr-history-month-right"><small>'+items.length+' DSR'+(items.length===1?'':'s')+'</small><span class="dsr-history-month-toggle" aria-hidden="true">⌄</span></span>'+
      '</button>'+
      '<div class="dsr-history-month-body" hidden>'+items.map(renderDsrHistoryCard).join('')+'</div>'+
     '</section>';
   }).join('');
  }catch(e){console.error(e);box.innerHTML='<div class="card">Could not load DSR history: '+String(e.message||e)+'</div>';}
 }
 window.addEventListener('load',load);
})();
window.toggleDsrMonth=function(button){
 const section=button.closest('.dsr-history-month');if(!section)return;
 const expanded=section.classList.toggle('expanded');
 const body=section.querySelector('.dsr-history-month-body');
 const toggle=section.querySelector('.dsr-history-month-toggle');
 if(body)body.hidden=!expanded;
 button.setAttribute('aria-expanded',expanded?'true':'false');
 if(toggle)toggle.textContent=expanded?'⌃':'⌄';
};
</script></body></html>
