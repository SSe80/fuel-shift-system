<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendant Dashboard</title><link rel="stylesheet" href="assets/style.css?v=20261002-12"></head><body class="attendant-page attendant-dashboard-page" data-app-page="userDashboard"><main class="wrap"><header class="app-header"><div><span class="eyebrow">FUEL OPERATIONS</span><h1>Attendant Dashboard</h1><p class="muted">Welcome back, <b id="name"></b></p></div><button class="header-action" onclick="logout()">Logout</button></header><nav class="nav" aria-label="Attendant navigation"><a class="active" href="attendant-dashboard.html">Dashboard</a><a href="shift.html">My Shift</a><a href="sales.html">Sales</a></nav><section class="page-heading"><div><span class="section-kicker">TODAY</span><h2>Shift Overview</h2><p>Review your assigned dispensers, confirmations and active shift.</p></div></section><div id="shift"></div><div id="handover-input-modal" class="modal" aria-hidden="true"><div class="modal-backdrop" onclick="cancelHandoverForm()"></div><div class="modal-card handover-modal-card"><div class="top"><div><span class="section-kicker">HANDOVER</span><h3 id="handover-dispenser-title">Dispenser</h3></div><button type="button" class="modal-close" onclick="cancelHandoverForm()" aria-label="Close">×</button></div><div class="handover-context"><div class="handover-context-item"><span>Dispenser</span><strong id="handover-dispenser">—</strong></div><div class="handover-context-item"><span>Tank</span><strong id="handover-tank">—</strong></div></div><form class="form" onsubmit="continueHandover(event)"><label>Receiving attendant<select id="handover-to-employee" required><option value="">Select receiving attendant</option></select></label><div class="handover-nozzle-section"><div class="handover-field-heading">Closing readings for dispenser nozzles</div><div id="handover-nozzle-readings"></div></div><label id="handover-closing-liters-label">Tank closing liter
