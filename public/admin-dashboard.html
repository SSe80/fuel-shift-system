</main><script src="assets/app.js?v=20261011-popup1"></script><script src="assets/accounting-closing.js?v=20261007-04"></script><script src="assets/app-boot.js?v=20261008-02"></script><script src="assets/admin-control-ui.js?v=20261010-01"></script>

<script src="assets/drive-queue.js?v=20261012-auto-export"></script>
<script>
(function () {
  'use strict';
  if (!window.DriveQueue || typeof buildDailyReportPdfBlob !== 'function' ||
      typeof buildMonthlySalesReportPdfBlob !== 'function') return;

  const arr = value => Array.isArray(value) ? value : [];
  const num = value => {
    const n = Number(value);
    return Number.isFinite(n) ? n : 0;
  };
  const firstNumber = values => {
    for (const value of values) {
      if (value !== null && value !== undefined && value !== '' && Number.isFinite(Number(value))) return Number(value);
    }
    return 0;
  };
  const dateMatches = (value, pattern) => pattern.test(String(value || ''));

  async function getReport(date) {
    return api('/api/reports/daily?date=' + encodeURIComponent(date));
  }

  async function buildDsr(key) {
    if (!dateMatches(key, /^\d{4}-\d{2}-\d{2}$/)) return null;
    const [report, products] = await Promise.all([
      getReport(key),
      api('/api/products')
    ]);
    if (!report || !report.report_ready) return null;
    window.currentDailyReportData = report;
    window.currentDailyReportDate = key;
    window.currentDsrProductInfo = Object.fromEntries(arr(products).map(function (p) {
      return [String(p.name || '').toLowerCase(), {
        code: p.code_name || p.name || 'Unknown',
        name: p.name || 'Unknown',
        color: p.color || ''
      }];
    }));
    return buildDailyReportPdfBlob();
  }

  async function buildMsr(month) {
    if (!dateMatches(month, /^\d{4}-\d{2}$/)) return null;
    const confirmations = await api('/api/reports/daily/confirmations');
    const dates = [...new Set(arr(confirmations)
      .filter(row => row && row.status === 'confirmed' && String(row.date || '').slice(0, 7) === month)
      .map(row => String(row.date).slice(0, 10))
      .filter(date => dateMatches(date, /^\d{4}-\d{2}-\d{2}$/)))].sort();
    if (!dates.length) return null;

    const reports = await Promise.all(dates.map(async date => {
      try { return [date, await getReport(date)]; }
      catch (_) { return [date, null]; }
    }));
    const days = reports.filter(entry => entry[1]).map(([date, report]) => {
      const performance = report.dsr_performance || report.performance || {};
      const summary = report.summary || {};
      const salesSummary = report.dsr_sales_summary || report.sales_summary || {};
      const sales = firstNumber([
        performance.calculated_sales_amount, performance.total_sales_amount,
        summary.sales_amount, salesSummary.total_amount, report.total_sales_amount
      ]);
      const liters = firstNumber([
        performance.total_sales_liters, summary.sales_liters,
        salesSummary.total_liters, report.total_sales_liters
      ]);
      const payment = performance.entered_payment_amount ??
        performance.entered_payments_amount ?? summary.entered_payment_amount ?? null;
      const shiftCount = firstNumber([performance.shift_count, summary.shift_count, report.shift_count]);
      return {
        date, report, sales, liters,
        payments: payment == null || !Number.isFinite(Number(payment)) ? null : Number(payment),
        shifts: shiftCount
      };
    });
    if (!days.length) return null;

    const totalSales = days.reduce((sum, day) => sum + day.sales, 0);
    const totalLiters = days.reduce((sum, day) => sum + day.liters, 0);
    const totalShifts = days.reduce((sum, day) => sum + day.shifts, 0);
    const allPaymentsPresent = days.every(day => day.payments !== null);
    const financialValues = days.map(day => {
      const value = (day.report.dsr_performance || day.report.performance || {}).financial_difference;
      return value == null || !Number.isFinite(Number(value)) ? null : Number(value);
    });
    const allFinancialValuesPresent = financialValues.every(value => value !== null);
    const productTotals = new Map();
    const salesTypeTotals = new Map();

    days.forEach(day => {
      const salesSummary = day.report.dsr_sales_summary || day.report.sales_summary || {};
      arr(salesSummary.by_product).forEach(item => {
        const code = String(item.product_code || item.code_name || item.product_code_name || item.product || item.name || 'Unknown product');
        const liters = firstNumber([item.total_liters, item.sales_liters, item.liters]);
        const amount = firstNumber([item.total_amount, item.sales_amount, item.amount]);
        const current = productTotals.get(code) || { code, liters: 0, sales: 0 };
        current.liters += liters; current.sales += amount; productTotals.set(code, current);
      });
      const typeRows = arr(salesSummary.by_type).length
        ? arr(salesSummary.by_type)
        : arr((day.report.dsr_performance || {}).sales_method_performance);
      typeRows.forEach(item => {
        const name = String(item.type || item.name || item.sale_type_name || 'Other');
        const value = firstNumber([item.amount, item.sales_amount, item.total_amount, item.total_sales_amount]);
        salesTypeTotals.set(name, (salesTypeTotals.get(name) || 0) + value);
      });
    });

    const typeTotal = [...salesTypeTotals.values()].reduce((sum, value) => sum + value, 0);
    const salesTypes = [...salesTypeTotals.entries()].map(([name, sales]) => ({
      name, sales, sharePct: typeTotal ? sales / typeTotal * 100 : 0
    })).sort((a, b) => b.sales - a.sales);
    const products = [...productTotals.values()].map(item => ({
      ...item, sharePct: totalSales ? item.sales / totalSales * 100 : 0
    })).sort((a, b) => b.sales - a.sales);
    const data = {
      month,
      summary: {
        confirmedDays: days.length,
        expectedDays: days.length,
        totalSales,
        totalLiters,
        totalShifts,
        enteredPayments: allPaymentsPresent ? days.reduce((sum, day) => sum + day.payments, 0) : null,
        financialDifference: allFinancialValuesPresent ? financialValues.reduce((sum, value) => sum + value, 0) : null,
        averageDailySales: totalSales / days.length
      },
      daily: days.map(day => ({
        date: day.date, sales: day.sales, liters: day.liters,
        payments: day.payments, shifts: day.shifts
      })),
      salesTypes,
      salesTypesForPdf: salesTypes,
      saleReasons: [],
      products,
      attendants: [],
      shifts: [],
      monthRanking: []
    };
    return buildMonthlySalesReportPdfBlob(data);
  }

  DriveQueue.start({ dsr: buildDsr, msr: buildMsr }, 30000);
})();
</script>
