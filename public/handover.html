<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shift Handover</title><link rel="stylesheet" href="assets/style.css"></head><body onload="loadHandover()"><main class="wrap"><div class="top"><h2>Shift Handover</h2><a href="attendant-dashboard.html">Back</a></div><div class="card"><p id="handover-status" class="muted">Loading active shift...</p><form class="form" onsubmit="submitHandover(event)"><input id="handover-shift" type="hidden"><select id="to-employee" required><option value="">Select receiving attendant</option></select><input id="closing-reading" type="number" min="0" step="0.01" placeholder="Closing meter reading" required><input id="closing-mm" type="number" min="0" step="0.01" placeholder="Closing dip (mm)" required><input id="closing-liters" type="number" min="0" step="0.01" placeholder="Closing tank liters" required><button class="primary">Submit Handover</button></form></div><div id="toast" class="toast"></div></main><script src="assets/app.js"></script></body></html>
