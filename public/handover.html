<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shift Handover</title><link rel="stylesheet" href="assets/style.css"></head><body class="attendant-page attendant-handover-page"><main class="wrap"><header class="app-header"><div><span class="eyebrow">FUEL OPERATIONS</span><h1>Shift Handover</h1><p class="muted">Transfer your dispenser shift safely to another attendant.</p></div><a class="header-action" href="attendant-dashboard.html">Dashboard</a></header><nav class="nav" aria-label="Attendant navigation"><a href="attendant-dashboard.html">Dashboard</a><a href="shift.html">My Shift</a><a class="active" href="handover.html">Handover</a><a href="sales.html">Sales</a></nav><section class="page-heading"><div><span class="section-kicker">SHIFT TRANSFER</span><h2>Close & Hand Over</h2><p>Enter the final readings and select the attendant receiving the shift.</p></div></section><section class="content-section"><div class="section-heading"><div><h3>Handover details</h3><p id="handover-status" class="section-status">Loading active shift...</p></div></div><form class="form" onsubmit="submitHandover(event)"><label>Dispenser shift<select id="handover-shift" required><option value="">Loading...</option></select></label><label>Receiving attendant<select id="to-employee" required><option value="">Select receiving attendant</option></select></label><div class="field-grid"><label>Closing meter reading<input id="closing-reading" type="number" min="0" step="0.01" placeholder="e.g. 125430.50" required></label><label>Closing dip (mm)<input id="closing-mm" type="number" min="0" step="0.01" placeholder="e.g. 820.00" required></label><label>Closing tank liters<input id="closing-liters" type="number" min="0" step="0.01" placeholder="e.g. 18500.00" required></label></div><button class="primary action-button">Submit Handover</button></form></section><div id="toast" class="toast"></div></main><script src="assets/app.js?v=20261002-06"></script></body></html>
