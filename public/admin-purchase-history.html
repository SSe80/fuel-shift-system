<body class="admin-purchases-page" data-app-page="adminPurchaseHistory"><main class="wrap">
<header class="purchase-header"><div><span class="eyebrow">INVENTORY CONTROL</span><h1>Purchase History</h1><p class="muted">All purchases with completed tank stock recording.</p></div><a class="purchase-back" href="admin-purchases.html">← Purchases</a></header>
<section class="purchase-section"><div class="purchase-section-head"><div><span class="section-kicker">PURCHASES</span><h2>Purchase History</h2><p class="muted">Complete recorded purchase history.</p></div><span class="admin-sales-section-count" id="purchase-history-count">0 recorded</span></div>
<div class="purchase-history-tools" style="display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap"><input id="purchase-history-search" type="search" placeholder="Search invoice or product…" oninput="renderFullPurchaseHistory()"><select id="purchase-history-period" onchange="renderFullPurchaseHistory()"><option value="all">All dates</option><option value="today">Today</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option></select><button type="button" onclick="loadFullPurchaseHistory()">↻ Refresh</button></div>
<div id="purchase-history-status" class="page-status"></div><div id="full-purchase-history-list" class="purchase-full-history-list"></div></section>
</main>
<script src="assets/app.js?v=20261005-03"></script>
<script>
(function(){
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let records=[];
function matches(p){
 const q=(document.getElementById('purchase-history-search')?.value||'').trim().toLowerCase();
 const hay=[p.invoice_number,p.product,p.product_code,p.plate_number,p.driver_name].filter(Boolean).join(' ').toLowerCase();
 if(q&&!hay.includes(q))return false;
 const period=document.getElementById('purchase-history-period')?.value||'all';
 if(period!=='all'){
  const raw=p.discharged_at||p.purchase_date||p.created_at; const d=raw?new Date(raw):null;
  if(!d||Number.isNaN(d.getTime()))return false;
  const now=new Date();
  if(period==='today'){if(d.toDateString()!==now.toDateString())return false;}
  else if(d<new Date(now.getTime()-Number(period)*86400000))return false;
 }
 return true;
}
window.toggleFullPurchaseHistoryCard=function(id){
 const card=document.querySelector('.purchase-full-history-card[data-id="'+CSS.escape(String(id))+'"]'); if(!card)return;
 const open=card.classList.toggle('expanded'); const body=card.querySelector('.purchase-full-history-body'); const toggle=card.querySelector('.purchase-full-history-toggle'); const head=card.querySelector('.purchase-full-history-head');
 if(body)body.hidden=!open;if(head)head.setAttribute('aria-expanded',open?'true':'false');if(toggle)toggle.textContent=open?'⌃':'⌄';
};
window.downloadFullPurchaseHistoryPdf=function(id){
 const p=records.find(x=>String(x.id)===String(id));
 if(!p){return;}
 window.currentPurchaseDetailId=id;
 window.currentPurchaseDetailData=p;
 if(typeof window.downloadPurchaseDetailPdf==='function'){
  window.downloadPurchaseDetailPdf();
 }else{
  if(typeof toast==='function')toast('Purchase PDF is not available.');
 }
};
window.toggleFullPurchaseHistoryMonth=function(monthKey){
 const group=document.querySelector('.purchase-full-history-month-group[data-month-key="'+CSS.escape(String(monthKey))+'"]');if(!group)return;
 const body=group.querySelector('.purchase-full-history-month-body'),head=group.querySelector('.purchase-full-history-month-head'),toggle=group.querySelector('.purchase-full-history-month-toggle');
 const open=group.classList.toggle('expanded');
 if(body)body.hidden=!open;if(head)head.setAttribute('aria-expanded',open?'true':'false');if(toggle)toggle.textContent=open?'⌃':'⌄';
};
window.toggleFullPurchaseHistoryCard=function(id){
 const card=document.querySelector('.purchase-full-history-card[data-id="'+CSS.escape(String(id))+'"]'); if(!card)return;
 const open=card.classList.toggle('expanded'); const body=card.querySelector('.purchase-full-history-body'); const toggle=card.querySelector('.purchase-full-history-toggle'); const head=card.querySelector('.purchase-full-history-head');
 if(body)body.hidden=!open;if(head)head.setAttribute('aria-expanded',open?'true':'false');if(toggle)toggle.textContent=open?'⌃':'⌄';
};
window.closeFullPurchaseHistoryDetail=function(){
 const el=document.getElementById('purchase-history-detail-overlay');if(el)el.remove();
};
window.openFullPurchaseHistoryDetail=function(id){
 const p=records.find(x=>String(x.id)===String(id));if(!p)return;
 const product=p.product||p.product_code||'—';
 const purchaseDate=p.purchase_date||p.created_at;
 const comps=Array.isArray(p.compartment_liters)?p.compartment_liters:[];
 const delivered=comps.reduce((s,v)=>s+Number(v||0),0);
 const history=Array.isArray(p.discharge_history)?p.discharge_history:[];
 const tanks=[...new Set(history.map(e=>e?.tank_code||e?.tank_id).filter(Boolean))].join(', ')||'—';
 const escHtml=esc;
 const discharge=history.length?history.map((e,i)=>'<div><span>Discharge '+(i+1)+'</span><strong>'+escHtml(e.discharge_datetime||e.discharged_at||e.created_at||'—')+' · '+Number(e.quantity_liters||e.discharged_quantity_liters||0).toLocaleString()+' L · '+escHtml(e.tank_code||e.tank_id||'—')+'</strong></div>').join(''):'<div><span>Discharge history</span><strong>None recorded</strong></div>';
 const overlay=document.createElement('div');
 overlay.id='purchase-history-detail-overlay';
 overlay.className='purchase-history-detail-overlay';
 overlay.innerHTML='<div class="purchase-history-detail-card" role="dialog" aria-modal="true" aria-label="Purchase details">'+
  '<div class="purchase-history-detail-head"><div><strong>'+escHtml(p.invoice_number?'Invoice #'+p.invoice_number:'Purchase — No Invoice')+'</strong><small>'+escHtml(product)+' · '+escHtml(purchaseDate?new Date(purchaseDate).toLocaleString():'—')+'</small></div><button type="button" class="purchase-history-detail-close" onclick="closeFullPurchaseHistoryDetail()" aria-label="Close">×</button></div>'+
  '<div class="purchase-history-detail-body">'+
   '<section class="purchase-history-detail-section"><h4>Purchase Summary</h4><div class="purchase-history-detail-grid">'+
    '<div><span>Product</span><strong>'+escHtml(product)+'</strong></div><div><span>Invoice</span><strong>'+escHtml(p.invoice_number||'—')+'</strong></div>'+
    '<div><span>Delivered quantity</span><strong>'+delivered.toLocaleString()+' L</strong></div><div><span>Purchase date</span><strong>'+escHtml(purchaseDate?new Date(purchaseDate).toLocaleString():'—')+'</strong></div>'+
    '<div><span>Discharge date</span><strong>'+escHtml(p.discharged_at?new Date(p.discharged_at).toLocaleString():'—')+'</strong></div><div><span>Status</span><strong>'+escHtml(p.status||'RECORDED')+'</strong></div>'+
   '</div></section>'+
   '<section class="purchase-history-detail-section"><h4>Truck & Driver</h4><div class="purchase-history-detail-grid">'+
    '<div><span>Driver</span><strong>'+escHtml(p.driver_name||'—')+'</strong></div><div><span>Phone</span><strong>'+escHtml(p.driver_phone||'—')+'</strong></div>'+
    '<div><span>Plate</span><strong>'+escHtml(p.plate_number||p.truck_plate||'—')+'</strong></div><div><span>Compartments</span><strong>'+escHtml(p.truck_compartments||comps.length||'—')+'</strong></div>'+
   '</div></section>'+
   '<section class="purchase-history-detail-section"><h4>Tank Information</h4><div class="purchase-history-detail-grid"><div><span>Tank</span><strong>'+escHtml(tanks)+'</strong></div><div><span>Operations</span><strong>'+history.length+'</strong></div></div></section>'+
   '<section class="purchase-history-detail-section"><h4>Discharge History</h4><div class="purchase-history-detail-list">'+discharge+'</div></section>'+
   '<div class="purchase-history-detail-actions"><button type="button" onclick="closeFullPurchaseHistoryDetail()">Close</button><button type="button" class="primary" onclick="downloadFullPurchaseHistoryPdf(\''+escHtml(p.id)+'\')">Download PDF</button></div>'+
  '</div></div>';
 overlay.addEventListener('click',e=>{if(e.target===overlay)closeFullPurchaseHistoryDetail();});
 document.body.appendChild(overlay);
};
window.renderFullPurchaseHistory=function(){
 const box=document.getElementById('full-purchase-history-list');if(!box)return;
 const rows=records.filter(matches);
 if(!rows.length){box.innerHTML='<div class="purchase-empty">No tank stock recorded purchases found.</div>';return;}
 const monthGroups={};
 rows.forEach(p=>{
  const raw=p.purchase_date||p.created_at||p.discharged_at;
  const d=raw?new Date(raw):null;
  const monthKey=d&&!Number.isNaN(d.getTime())
   ?new Intl.DateTimeFormat('en-CA',{timeZone:'Africa/Addis_Ababa',year:'numeric',month:'2-digit'}).format(d)
   :'unknown';
  (monthGroups[monthKey]||(monthGroups[monthKey]=[])).push(p);
 });
 const monthKeys=Object.keys(monthGroups).sort((a,b)=>b.localeCompare(a));
 const renderPurchase=p=>{
  const product=p.product||p.product_code||'—',invoice=p.invoice_number?('Invoice #'+p.invoice_number):'Purchase — No Invoice';
  const purchaseDate=p.purchase_date||p.created_at; const discharged=p.discharged_at;
  const comps=Array.isArray(p.compartment_liters)?p.compartment_liters:[]; const delivered=comps.reduce((s,v)=>s+Number(v||0),0);
  const history=Array.isArray(p.discharge_history)?p.discharge_history:[]; const tanks=[...new Set(history.map(e=>e?.tank_code||e?.tank_id).filter(Boolean))].join(', ')||'—';
  return '<article class="purchase-card purchase-full-history-card" data-id="'+esc(p.id)+'">'+
   '<button type="button" class="purchase-full-history-head" onclick="toggleFullPurchaseHistoryCard(this.dataset.id)" data-id="'+esc(p.id)+'" aria-expanded="false">'+
    '<span class="purchase-full-history-title"><span class="dot"></span><span><strong>'+esc(invoice)+'</strong><small>'+esc(product)+' · '+esc(purchaseDate?new Date(purchaseDate).toLocaleString():'—')+'</small></span></span>'+
    '<span class="purchase-full-history-right"><span class="badge">✓ RECORDED</span><span class="purchase-full-history-toggle">⌄</span></span>'+
   '</button>'+
   '<div class="purchase-full-history-body" hidden>'+
    '<div class="purchase-full-history-grid"><div><span>Delivered quantity</span><strong>'+esc(delivered.toLocaleString())+' L</strong></div><div><span>Invoice</span><strong>'+esc(p.invoice_number||'—')+'</strong></div><div><span>Purchase date</span><strong>'+esc(purchaseDate?new Date(purchaseDate).toLocaleString():'—')+'</strong></div><div><span>Discharge date</span><strong>'+esc(discharged?new Date(discharged).toLocaleString():'—')+'</strong></div><div><span>Tank</span><strong>'+esc(tanks)+'</strong></div><div><span>Driver</span><strong>'+esc(p.driver_name||'—')+'</strong></div></div>'+
    '<div class="purchase-full-history-actions">'+
      '<button type="button" onclick="openFullPurchaseHistoryDetail(\''+esc(p.id)+'\')">View details</button>'+
      '<button type="button" class="primary" onclick="downloadFullPurchaseHistoryPdf(\''+esc(p.id)+'\')">Download PDF</button>'+
    '</div>'+
   '</div>'+
  '</article>';
 };
 box.innerHTML=monthKeys.map(monthKey=>{
  const monthDate=new Date(monthKey==='unknown'?'invalid':monthKey+'-01T00:00:00');
  const monthLabel=Number.isNaN(monthDate.getTime())?(monthKey==='unknown'?'Unknown date':monthKey):monthDate.toLocaleDateString(undefined,{month:'long',year:'numeric'});
  const groupRows=monthGroups[monthKey];
  return '<section class="purchase-full-history-month-group" data-month-key="'+esc(monthKey)+'">'+
   '<button type="button" class="purchase-full-history-month-head" onclick="toggleFullPurchaseHistoryMonth(\''+esc(monthKey)+'\')" aria-expanded="false">'+
    '<span class="purchase-full-history-month-title"><span class="section-kicker">MONTH</span><strong>'+esc(monthLabel)+'</strong></span>'+
    '<span class="purchase-full-history-month-right"><small>'+groupRows.length+' purchase'+(groupRows.length===1?'':'s')+'</small><span class="purchase-full-history-month-toggle">⌄</span></span>'+
   '</button>'+
   '<div class="purchase-full-history-month-body" hidden>'+groupRows.map(renderPurchase).join('')+'</div>'+
  '</section>';
 }).join('');
};
window.loadFullPurchaseHistory=async function(){
 const status=document.getElementById('purchase-history-status');
 try{
  if(status)status.textContent='Loading purchase history…';
  const me=await currentUser();if(me.role!=='admin')return location.href='admin-login.html';
  const rows=await api('/api/purchases?status=discharged');
  records=(Array.isArray(rows)?rows:[]).filter(p=>{const h=Array.isArray(p.discharge_history)?p.discharge_history:[];return h.length>0&&h.every(e=>e?.tank_stock_recorded===true);});
  const count=document.getElementById('purchase-history-count');if(count)count.textContent=records.length+' recorded';
  renderFullPurchaseHistory();if(status)status.textContent='';
 }catch(e){if(status)status.textContent=e.message||'Unable to load purchase history.';}
};
window.addEventListener('DOMContentLoaded',loadFullPurchaseHistory);
})();
</script></body></html>
