stock-group.recorded .purchase-history-stock-group-head{padding-top:2px}.purchase-history-recorded-head{min-height:68px}}

.purchase-detail-tank-card{margin-top:7px;padding:10px;border:1px solid #e4e7ec;border-radius:11px;background:#f8fafc}.purchase-detail-tank-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:3px}.purchase-detail-tank-head>div{display:flex;align-items:center;gap:7px}.purchase-detail-tank-dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}.purchase-detail-tank-head strong{font-size:12px;color:#101828}.purchase-detail-tank-head>span{padding:3px 7px;border-radius:999px;background:#eaf2ff;color:#2563eb;font-size:8px;font-weight:800;text-transform:uppercase}.purchase-detail-tank-card .purchase-detail-row{padding:6px 0}

<div class="purchase-history-tools" style="display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap"><input id="purchase-history-search" type="search" placeholder="Search invoice or product…" oninput="renderFullPurchaseHistory()"><select id="purchase-history-period" onchange="renderFullPurchaseHistory()"><option value="all">All dates</option><option value="today">Today</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option></select><button type="button" onclick="loadFullPurchaseHistory()">↻ Refresh</button></div>
<div id="purchase-history-status" class="page-status"></div><div id="full-purchase-history-list" class="purchase-full-history-list"></div></section>
<div id="purchase-detail-modal" class="modal" aria-hidden="true"><div class="modal-backdrop" onclick="closePurchaseDetail()"></div><div class="modal-card purchase-detail-card"><div class="top"><div><span class="section-kicker">PURCHASE DETAILS</span><h3>Purchase Details</h3></div><button type="button" class="modal-close" onclick="closePurchaseDetail()">×</button></div><div id="purchase-detail-content" class="purchase-detail-content"></div><div class="purchase-detail-actions" id="purchase-detail-actions"><button type="button" class="purchase-detail-download" onclick="downloadPurchaseDetailPdf()">Download PDF</button><button type="button" onclick="closePurchaseDetail()">Close</button></div></div></div></main>
<script src="assets/app.js?v=20261005-03"></script>
<script>
(function(){
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let records=[];
function matches(p){
 const q=(document.getElementById('purchase-history-search')?.value||'').trim().toLowerCase();
 const hay=[p.invoice_number,p.product,p.product_code,p.plate_number,p.driver_name].filter(Boolean).join(' ').toLowerCase();
 if(q&&!hay.includes(q))return false;
 const period=document.getElementById('purchase-history-period')?.value||'all';
 if(period!=='all'){
  const raw=p.discharged_at||p.purchase_date||p.created_at; const d=raw?new Date(raw):null;
  if(!d||Number.isNaN(d.getTime()))return false;
  const now=new Date();
  if(period==='today'){if(d.toDateString()!==now.toDateString())return false;}
  else if(d<new Date(now.getTime()-Number(period)*86400000))return false;
 }
 return true;
}
let purchaseDetailData=records;
let purchaseDetailTanks=[];
let purchaseProducts=[];
let purchaseShifts=[];
let purchaseEmployees=[];
const purchaseH=esc;
const purchaseLiters=v=>Number(v||0).toLocaleString(undefined,{maximumFractionDigits:2});
window.closePurchaseDetail=function(){const m=document.getElementById('purchase-detail-modal');if(m){m.classList.remove('open');m.setAttribute('aria-hidden','true');}};
  window.openPurchaseDetail=function(purchaseId){
    window.currentPurchaseDetailId=purchaseId;
    const p=purchaseDetailData?.find(x=>String(x.id)===String(purchaseId)); if(!p)return;
    window.currentPurchaseDetailData=p;
    window.currentPurchaseDetailTanks=purchaseDetailTanks||[];
    const tank=purchaseDetailTanks?.find(x=>String(x.id)===String(p.tank_id));
    const productRecord=purchaseProducts.find(x=>String(x.name||'').toLowerCase()===String(p.product||tank?.product||'').toLowerCase());
    const productCode=productRecord?.code_name||p.product||'—';
    const productColor=productRecord?.color||'#2563eb';
    const compartments=Array.isArray(p.compartment_liters)?p.compartment_liters:[];
    const dischargedIndexes=Array.isArray(p.discharged_compartment_indexes)?p.discharged_compartment_indexes:[];
    const history=Array.isArray(p.discharge_history)?p.discharge_history:[];
    const tankStockRecorded=history.length>0&&history.every(e=>e?.tank_stock_recorded===true);
    const ordered=Number(p.ordered_quantity_liters||0);
    const total=compartments.reduce((sum,v)=>sum+Number(v||0),0);
    const discharged=Number(p.discharged_quantity_liters||0);
    const remaining=Math.max(total-discharged,0);
    const difference=total-ordered===0?'Matches order':total-ordered>0?'Over by '+purchaseLiters(total-ordered)+' L':'Short by '+purchaseLiters(Math.abs(total-ordered))+' L';
    const statusText=String(p.status||'').replaceAll('_',' ');
    const rows=items=>items.map(([label,value])=>'<div class="purchase-detail-row"><span>'+purchaseH(label)+'</span><strong>'+purchaseH(value)+'</strong></div>').join('');
    const compartmentRows=compartments.map((v,i)=>'<div class="purchase-detail-compartment"><span>Compartment '+(i+1)+' · '+(dischargedIndexes.includes(i+1)?'Discharged':'Undischarged')+'</span><b>'+purchaseLiters(v)+' L</b></div>').join('');
    const detailActions=document.getElementById('purchase-detail-actions');
    if(detailActions){detailActions.querySelector('.purchase-detail-download').style.display=tankStockRecorded?'':'none';}
    const eventRows=history.map((e,i)=>{
      const before=Number(e.tank_liters_before), qty=Number(e.discharged_quantity_liters||0), recorded=Number(e.tank_stock_recorded_liters);
      const hasBefore=Number.isFinite(before), hasRecorded=Number.isFinite(recorded), expectedAfter=hasBefore?before+qty:null;
      const diff=hasBefore&&hasRecorded?recorded-expectedAfter:null;
      const tolerance=Number.isFinite(qty)?Math.max(5,qty*0.01):5;
      const differenceHigh=Number.isFinite(diff)&&Math.abs(diff)>tolerance;
      const recordedOk=e.tank_stock_recorded===true&&!differenceHigh;
      const stockStatus=e.tank_stock_recorded===true?(differenceHigh?'Difference high':'Stock reconciled'):'Tank stock not recorded';
      const stockClass=recordedOk?'purchase-detail-stock-ok':'purchase-detail-stock-alert';
      const tankId=String(e.tank_id||'');
      const tankRecord=purchaseDetailTanks?.find(t=>String(t.id)===tankId);
      const direct=Array.isArray(tankRecord?.active_shifts)?tankRecord.active_shifts:[];
      const matching=direct.length?direct:purchaseShifts.filter(s=>Array.isArray(s.nozzle_readings)&&s.nozzle_readings.some(n=>String(n.tank_id)===tankId));
      const attendants=[...new Map(matching.map(s=>{
        const name=s.employee_name||purchaseEmployees.find(emp=>String(emp.id)===String(s.employee_id))?.name||'Assigned attendant';
        return [String(s.employee_id||name),name];
      })).values()];
      const attendantText=attendants.length?attendants.join(', '):'No shift attendant recorded';
      return '<article class="purchase-detail-discharge-event"><div class="purchase-detail-event-title"><div><span class="purchase-detail-event-number">DISCHARGE '+(i+1)+'</span><strong>'+purchaseH(e.tank_code||tankRecord?.tank_code||'Tank')+'</strong></div><span class="'+stockClass+'">'+(recordedOk?'✓ ':'⚠ ')+stockStatus+'</span></div><div class="purchase-detail-event-grid">'+
        '<div><span>Date & time</span><strong>'+purchaseH(e.discharge_datetime?new Date(e.discharge_datetime).toLocaleString():'—')+'</strong></div>'+
        '<div><span>Shift attendant(s)</span><strong>'+purchaseH(attendantText)+'</strong></div>'+
        '<div><span>Compartments</span><strong>'+purchaseH(Array.isArray(e.compartment_indexes)?e.compartment_indexes.map(x=>'C'+x).join(', '):'—')+'</strong></div>'+
        '<div><span>Quantity discharged</span><strong>'+purchaseH(purchaseLiters(qty))+' L</strong></div>'+
        '<div><span>Tank stock before</span><strong>'+purchaseH(hasBefore?purchaseLiters(before)+' L':'—')+'</strong></div>'+
        '<div><span>Expected closing</span><strong>'+purchaseH(Number.isFinite(expectedAfter)?purchaseLiters(expectedAfter)+' L':'—')+'</strong></div>'+
        '<div><span>Recorded closing</span><strong>'+purchaseH(hasRecorded?purchaseLiters(recorded)+' L':'Not recorded')+'</strong></div>'+
        '<div><span>Stock difference</span><strong>'+purchaseH(Number.isFinite(diff)?(diff>0?'+':'')+purchaseLiters(diff)+' L':'—')+'</strong></div>'+
      '</div></article>';
    }).join('');
    const tankEntries=[];
    const addTankEntry=(tankId,tankCode)=>{
      const key=String(tankId||tankCode||''); if(!key)return;
      if(!tankEntries.some(x=>x.key===key))tankEntries.push({key,tankId:String(tankId||''),tankCode:tankCode||'—'});
    };
    addTankEntry(tank?.id,tank?.tank_code);
    history.forEach(e=>addTankEntry(e?.tank_id,e?.tank_code));
    const tankSections=tankEntries.map(entry=>{
      return '<article class="purchase-detail-tank-card"><div class="purchase-detail-tank-head"><div><span class="purchase-detail-tank-dot" style="background:'+purchaseH(productColor)+'"></span><strong>'+purchaseH(entry.tankCode)+'</strong></div><span>Tank</span></div><div class="purchase-detail-row"><span>Discharge operations</span><strong>'+history.filter(e=>String(e?.tank_id||'')===String(entry.tankId)).length+'</strong></div></article>';
    }).join('');
    const purchaseRemark=[...history].reverse().map(e=>String(e?.tank_stock_remark||'').trim()).find(Boolean)||'';
    const el=document.getElementById('purchase-detail-content');
    if(el)el.innerHTML=
      '<div class="purchase-detail-hero">'+
        '<div><span class="purchase-detail-kicker">PURCHASE</span><div class="purchase-detail-product"><span class="purchase-detail-product-dot" style="background:'+purchaseH(productColor)+'"></span><h4>'+purchaseH(p.invoice_number?('Invoice #'+p.invoice_number):'Purchase — No Invoice')+'</h4></div><p>'+purchaseH(productCode)+'</p></div>'+
        '<div class="purchase-detail-status-badge '+(String(p.status||'').toLowerCase()==='discharged'?'success':'pending')+'">'+purchaseH(statusText||'Purchase')+'</div>'+
      '</div>'+
      '<section class="purchase-detail-section purchase-detail-summary"><div class="purchase-detail-summary-grid">'+
        '<div><span>Delivered quantity</span><strong>'+purchaseH(purchaseLiters(total))+' L</strong></div>'+
        '<div><span>Discharged quantity</span><strong>'+purchaseH(purchaseLiters(discharged))+' L</strong></div>'+
        '<div><span>Undischarged quantity</span><strong>'+purchaseH(purchaseLiters(remaining))+' L</strong></div>'+
        '<div><span>Purchase date</span><strong>'+purchaseH(p.purchase_date?new Date(p.purchase_date).toLocaleString():'—')+'</strong></div>'+
      '</div></section>'+
      '<section class="purchase-detail-section"><div class="purchase-detail-section-head"><h4>Order</h4></div>'+rows([['Product',productCode],['Invoice number',p.invoice_number||'—'],['Ordered quantity',purchaseLiters(ordered)+' L'],['Difference',difference]])+'</section>'+
      '<section class="purchase-detail-section"><div class="purchase-detail-section-head"><h4>Truck & Driver</h4></div>'+rows([['Driver name',p.driver_name||'—'],['Driver phone',p.driver_phone||'—'],['Plate number',p.plate_number||'—'],['Compartments',String(p.truck_compartments||'—')]])+(compartments.length?'<div class="purchase-detail-compartments"><h5>Compartment quantities</h5>'+compartmentRows+'</div>':'')+'</section>'+
      (tankSections?'<section class="purchase-detail-section"><div class="purchase-detail-section-head"><h4>Tanks</h4><span>'+tankEntries.length+' tank'+(tankEntries.length===1?'':'s')+'</span></div>'+tankSections+'</section>':'')+
      '<section class="purchase-detail-section"><div class="purchase-detail-section-head"><h4>Delivery</h4><span class="purchase-detail-delivery-status">'+purchaseH(statusText||'—')+'</span></div>'+rows([['Delivered quantity',purchaseLiters(total)+' L'],['Discharged quantity',purchaseLiters(discharged)+' L'],['Undischarged quantity',purchaseLiters(remaining)+' L'],['Difference',difference],['Fully discharged at',p.discharged_at?new Date(p.discharged_at).toLocaleString():'Not yet']])+'</section>'+
      (history.length?'<section class="purchase-detail-section"><div class="purchase-detail-section-head"><h4>Discharge History</h4><span>'+history.length+' operation'+(history.length===1?'':'s')+'</span></div>'+eventRows+'</section>':'')+
      '<section class="purchase-detail-remark"><div class="purchase-detail-remark-head"><div><span class="purchase-detail-kicker">FINAL NOTE</span><h4>Purchase Remark</h4></div><span>Optional</span></div><p>'+purchaseH(purchaseRemark||'No remark added for this purchase.')+'</p></section>';
    const m=document.getElementById('purchase-detail-modal');if(m){m.classList.add('open');m.setAttribute('aria-hidden','false');}
  };

window.togglePurchaseHistoryRecordedCard=function(id){
 const cards=document.querySelectorAll('.purchase-history-recorded-minimized');
 let card=null;
 cards.forEach(el=>{if(String(el.getAttribute('data-id'))===String(id))card=el;});
 if(!card)return;
 const expanded=card.classList.toggle('expanded');
 const body=card.querySelector('.purchase-history-recorded-body');
 const toggle=card.querySelector('.purchase-history-recorded-toggle');
 const head=card.querySelector('.purchase-history-recorded-head');
 if(body)body.hidden=!expanded;
 if(head)head.setAttribute('aria-expanded',expanded?'true':'false');
 if(toggle)toggle.textContent=expanded?'⌃':'⌄';
};
window.downloadFullPurchaseHistoryPdf=function(id){
 const p=records.find(x=>String(x.id)===String(id));if(!p)return;
 window.currentPurchaseDetailId=id;
 window.currentPurchaseDetailData=p;
 if(typeof window.downloadPurchaseDetailPdf==='function')window.downloadPurchaseDetailPdf();
};
window.renderFullPurchaseHistory=function(){
 const box=document.getElementById('full-purchase-history-list');if(!box)return;
 const rows=records.filter(matches);
 if(!rows.length){box.innerHTML='<div class="purchase-empty">No tank stock recorded purchases found.</div>';return;}
 const monthGroups={};
 rows.forEach(p=>{
  const raw=p.purchase_date||p.created_at||p.discharged_at;
  const d=raw?new Date(raw):null;
  const monthKey=d&&!Number.isNaN(d.getTime())
   ?new Intl.DateTimeFormat('en-CA',{timeZone:'Africa/Addis_Ababa',year:'numeric',month:'2-digit'}).format(d)
   :'unknown';
  (monthGroups[monthKey]||(monthGroups[monthKey]=[])).push(p);
 });
 const monthKeys=Object.keys(monthGroups).sort((a,b)=>b.localeCompare(a));
 const renderPurchase=p=>{
  const productRecord=purchaseProducts.find(x=>String(x.name||'').toLowerCase()===String(p.product||'').toLowerCase());
  const productCode=productRecord?.code_name||p.product||'—';
  const productColor=productRecord?.color||'#2563eb';
  const compartments=Array.isArray(p.compartment_liters)?p.compartment_liters:[];
  const total=compartments.reduce((sum,v)=>sum+Number(v||0),0);
  const datePurchase=p.purchase_date?new Date(p.purchase_date).toLocaleString():'—';
  return '<article class="purchase-card purchase-history-full-card purchase-history-recorded-minimized" data-id="'+purchaseH(p.id)+'"><button type="button" class="purchase-history-recorded-head" onclick="togglePurchaseHistoryRecordedCard(this.dataset.id)" data-id="'+purchaseH(p.id)+'" aria-expanded="false"><span class="purchase-history-recorded-title"><span class="purchase-product-color" style="background:'+purchaseH(productColor)+'"></span><span><strong>'+purchaseH(p.invoice_number?('Invoice #'+p.invoice_number):'Purchase — No Invoice')+'</strong><small>'+purchaseH(productCode)+' · '+purchaseH(datePurchase)+'</small></span></span><span class="purchase-history-recorded-right"><span class="purchase-history-full-badge">✓ RECORDED</span><span class="purchase-history-recorded-toggle" aria-hidden="true">⌄</span></span></button><div class="purchase-history-recorded-body" hidden><div class="purchase-history-full-main"><div><span>Delivered quantity</span><strong>'+purchaseH(purchaseLiters(total))+' L</strong></div><div><span>Invoice</span><strong>'+purchaseH(p.invoice_number||'—')+'</strong></div><div><span>Fully discharged</span><strong>'+purchaseH(p.discharged_at?new Date(p.discharged_at).toLocaleString():'—')+'</strong></div></div><div class="purchase-history-card-actions"><button type="button" onclick="openPurchaseDetail(this.dataset.id)" data-id="'+purchaseH(p.id)+'">View Details</button><button type="button" disabled class="tank-stock-recorded">✓ Tank Stock Recorded</button></div></div></article>';
 };
 box.innerHTML=monthKeys.map(monthKey=>{
  const monthDate=new Date(monthKey==='unknown'?'invalid':monthKey+'-01T00:00:00');
  const monthLabel=Number.isNaN(monthDate.getTime())?(monthKey==='unknown'?'Unknown date':monthKey):monthDate.toLocaleDateString(undefined,{month:'long',year:'numeric'});
  const groupRows=monthGroups[monthKey];
  return '<section class="purchase-full-history-month-group" data-month-key="'+esc(monthKey)+'">'+
   '<button type="button" class="purchase-full-history-month-head" onclick="toggleFullPurchaseHistoryMonth(\''+esc(monthKey)+'\')" aria-expanded="false">'+
    '<span class="purchase-full-history-month-title"><span class="section-kicker">MONTH</span><strong>'+esc(monthLabel)+'</strong></span>'+
    '<span class="purchase-full-history-month-right"><small>'+groupRows.length+' purchase'+(groupRows.length===1?'':'s')+'</small><span class="purchase-full-history-month-toggle">⌄</span></span>'+
   '</button>'+
   '<div class="purchase-full-history-month-body" hidden>'+groupRows.map(renderPurchase).join('')+'</div>'+
  '</section>';
 }).join('');
};
window.loadFullPurchaseHistory=async function(){
 const status=document.getElementById('purchase-history-status');
 try{
  if(status)status.textContent='Loading purchase history…';
  const me=await currentUser();if(me.role!=='admin')return location.href='admin-login.html';
  const [rows,productsData,tanksData,shiftsData,employeesData]=await Promise.all([api('/api/purchases?status=discharged'),api('/api/products'),api('/api/tanks'),api('/api/shifts'),api('/api/employees')]);
  purchaseProducts=Array.isArray(productsData)?productsData:[];
  purchaseDetailTanks=Array.isArray(tanksData)?tanksData:[];
  purchaseShifts=Array.isArray(shiftsData)?shiftsData:[];
  purchaseEmployees=Array.isArray(employeesData)?employeesData:[];
  records=(Array.isArray(rows)?rows:[]).filter(p=>{const h=Array.isArray(p.discharge_history)?p.discharge_history:[];return h.length>0&&h.every(e=>e?.tank_stock_recorded===true);});
  const count=document.getElementById('purchase-history-count');if(count)count.textContent=records.length+' recorded';
  purchaseDetailData=records;renderFullPurchaseHistory();if(status)status.textContent='';
 }catch(e){if(status)status.textContent=e.message||'Unable to load purchase history.';}
};
window.toggleFullPurchaseHistoryMonth=function(monthKey){
 const groups=document.querySelectorAll('.purchase-full-history-month-group');
 let group=null;
 groups.forEach(el=>{if(String(el.getAttribute('data-month-key'))===String(monthKey))group=el;});
 if(!group)return;
 const body=group.querySelector('.purchase-full-history-month-body');
 const head=group.querySelector('.purchase-full-history-month-head');
 const toggle=group.querySelector('.purchase-full-history-month-toggle');
 const expanded=group.classList.toggle('expanded');
 if(body)body.hidden=!expanded;
 if(head)head.setAttribute('aria-expanded',expanded?'true':'false');
 if(toggle)toggle.textContent=expanded?'⌃':'⌄';
};
window.addEventListener('DOMContentLoaded',loadFullPurchaseHistory);
})();
</script></body></html>
