<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fuel Shift System - First Admin Setup</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:520px;margin:0 auto;padding:24px;background:#f5f7fa}
    .card{background:white;padding:24px;border-radius:16px;box-shadow:0 2px 12px #0001}
    h1{margin-top:0}.field{margin:16px 0}label{display:block;font-weight:600;margin-bottom:6px}
    input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccc;border-radius:10px;font-size:16px}
    button{width:100%;padding:13px;border:0;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}
    .msg{margin-top:16px;padding:12px;border-radius:10px;display:none;white-space:pre-wrap}
    .ok{background:#e8f7e8}.err{background:#fdeaea}
    small{color:#666}
  </style>
</head>
<body>
<div class="card">
  <h1>First Admin Setup</h1>
  <p>Create the first administrator for the Fuel Shift System.</p>
  <small>Your Bootstrap Token is sent only to your Worker and is not stored by this page.</small>
  <form id="form">
    <div class="field"><label>Name</label><input id="name" value="Admin" required></div>
    <div class="field"><label>Phone</label><input id="phone" value="0902727273" required></div>
    <div class="field"><label>PIN</label><input id="pin" type="password" inputmode="numeric" minlength="4" autocomplete="new-password" required></div>
    <div class="field"><label>Bootstrap Token</label><input id="token" type="password" autocomplete="off" required></div>
    <button type="submit">Create Admin</button>
  </form>
  <div id="msg" class="msg"></div>
</div>
<script>
const form=document.getElementById('form'),msg=document.getElementById('msg');
form.addEventListener('submit',async e=>{
  e.preventDefault(); msg.style.display='none';
  const data={name:document.getElementById('name').value.trim(),phone:document.getElementById('phone').value.trim(),pin:document.getElementById('pin').value};
  const token=document.getElementById('token').value;
  try{
    const r=await fetch('/api/bootstrap-admin',{method:'POST',headers:{'Content-Type':'application/json','X-Bootstrap-Token':token},body:JSON.stringify(data)});
    const out=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(out.error ? JSON.stringify(out.error) : 'Request failed');
    msg.className='msg ok'; msg.textContent='Admin created successfully. You can now return to the main login page.';
    msg.style.display='block'; form.reset(); document.getElementById('name').value='Admin'; document.getElementById('phone').value='0902727273';
  }catch(err){msg.className='msg err';msg.textContent=err.message;msg.style.display='block'}
});
</script>
</body>
</html>
