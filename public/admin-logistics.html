<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1727">
  <title>Admin Logistics | Fuel Shift System</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    :root {
      --logistics-accent: #d97706;
      --logistics-accent-dark: #b45309;
      --logistics-border: #243449;
      --logistics-muted: #667085;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: #172033;
      font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(37,99,235,.10), transparent 42%),
        linear-gradient(145deg, #f8fafc 0%, #eef3f9 48%, #f8fafc 100%);
    }
    .login-page {
      width: min(100% - 32px, 460px);
      min-height: 100vh;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 0;
    }
    .login-card {
      width: 100%;
      padding: 40px 34px 30px;
      background: #fff;
      border: 1px solid var(--logistics-border);
      border-radius: 22px;
      box-shadow: 0 24px 65px rgba(15,23,42,.12);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 30px;
    }
    .brand-mark {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 14px;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      color: var(--logistics-accent-dark);
    }
    .brand-mark svg { width: 25px; height: 25px; }
    .brand-name {
      color: #344054;
      font-size: 13px;
      font-weight: 750;
      letter-spacing: .8px;
      text-transform: uppercase;
    }
    .brand-subtitle {
      margin-top: 4px;
      color: #98a2b3;
      font-size: 12px;
    }
    h1 {
      margin: 0 0 9px;
      color: #101828;
      font-size: clamp(27px, 6vw, 32px);
      line-height: 1.15;
      letter-spacing: -.7px;
    }
    .subtitle {
      margin: 0 0 26px;
      color: var(--logistics-muted);
      font-size: 14px;
      line-height: 1.65;
    }
    .form { display: grid; gap: 14px; }
    .field-label {
      display: block;
      margin: 0 0 7px;
      color: #344054;
      font-size: 13px;
      font-weight: 650;
    }
    input {
      width: 100%;
      height: 52px;
      padding: 0 15px;
      border: 1px solid #d0d5dd;
      border-radius: 11px;
      outline: none;
      background: #fff;
      color: #101828;
      font: inherit;
      transition: border-color .18s, box-shadow .18s;
    }
    input::placeholder { color: #98a2b3; }
    input:focus {
      border-color: var(--logistics-accent);
      box-shadow: 0 0 0 3px rgba(217,119,6,.14);
    }
    button {
      width: 100%;
      min-height: 52px;
      margin-top: 5px;
      border: 0;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--logistics-accent), var(--logistics-accent-dark));
      color: #fff;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(180,83,9,.2);
    }
    button:hover { filter: brightness(1.06); }
    button:focus-visible { outline: 3px solid #fdba74; outline-offset: 3px; }
    .security-note {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
      margin: 20px 0 0;
      color: #667085;
      font-size: 12px;
      text-align: center;
    }
    .security-note svg { width: 15px; height: 15px; color: #15803d; }
    .toast { margin-top: 12px; }
    .back {
      display: block;
      margin-top: 20px;
      color: #667085;
      font-size: 13px;
      text-align: center;
      text-decoration: none;
    }
    .back:hover { color: #b45309; }
    @media (max-width: 520px) {
      .login-card { padding: 32px 23px 26px; border-radius: 18px; }
    }
  </style>
</head>
<body>
  <main class="login-page">
    <section class="login-card" aria-labelledby="page-title">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6M9 9h.01M15 9h.01M9 12h.01M15 12h.01"/>
          </svg>
        </div>
        <div>
          <div class="brand-name">Fuel Shift System</div>
          <div class="brand-subtitle">Station operations portal</div>
        </div>
      </div>

      <h1 id="page-title">Admin Logistics</h1>
      <p class="subtitle">Sign in with your administrator credentials to continue to station management.</p>

      <form id="login-form" class="form" data-role="admin" data-success-url="admin-logistics-dashboard.html">
        <div>
          <label class="field-label" for="operator-id">Operator ID</label>
          <input id="operator-id" name="operator_id" placeholder="Last 6 digits" inputmode="numeric" autocomplete="username" required>
        </div>
        <div>
          <label class="field-label" for="pin">Administrator PIN</label>
          <input id="pin" name="pin" placeholder="Enter your PIN" type="password" inputmode="numeric" autocomplete="current-password" required>
        </div>
        <button type="submit">Sign in to Admin Logistics</button>
      </form>

      <p class="security-note">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        Secure administrator sign-in
      </p>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <a class="back" href="index.html">Back to Fuel Shift System</a>
    </section>
  </main>
  <script src="assets/login.js?v=20261007-03"></script>
  <script src="assets/popup-portal.js?v=20261011-p1"></script>
</body>
</html>
