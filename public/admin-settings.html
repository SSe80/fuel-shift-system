<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Settings</title><link rel="stylesheet" href="assets/style.css"></head>
<body onload="adminSettings()">
<main class="wrap">
  <div class="top"><div><h2>Admin Settings</h2><p class="muted">Station configuration</p></div><a href="admin-dashboard.html">Back</a></div>

  <div class="card">
    <h3>Employees</h3>
    <form class="form" onsubmit="createEmployee(event)">
      <input id="employee-name" placeholder="Employee name" required>
      <input id="employee-phone" placeholder="Phone number" required>
      <input id="employee-pin" type="password" inputmode="numeric" placeholder="PIN (4+ digits)" minlength="4" required>
      <select id="employee-role"><option value="employee">Employee</option><option value="admin">Admin</option></select>
      <button class="primary">Add employee</button>
    </form>

    <div id="employee-edit-modal" class="modal" aria-hidden="true">
      <div class="modal-backdrop" onclick="closeEmployeeEdit()"></div>
      <form id="employee-edit-form" class="modal-card form" onsubmit="saveEmployeeEdit(event)">
        <div class="top"><h3>Edit Employee</h3><button type="button" class="modal-close" onclick="closeEmployeeEdit()" aria-label="Close">×</button></div>
        <input id="edit-employee-id" type="hidden">
        <label>Name<input id="edit-employee-name" required></label>
        <label>Phone number<input id="edit-employee-phone" required></label>
        <label>Role<select id="edit-employee-role"><option value="employee">Employee</option><option value="admin">Admin</option></select></label>
        <label>New PIN <span class="muted">(leave blank to keep current PIN)</span><input id="edit-employee-pin" type="password" inputmode="numeric" minlength="4" placeholder="New PIN"></label>
        <div class="row">
          <button type="submit" class="primary">Save Changes</button>
          <button type="button" onclick="closeEmployeeEdit()">Cancel</button>
        </div>
      </form>
    </div>

    <div id="employees"></div>
  </div>

  <div class="card">
    <h3>Products</h3>
    <form class="form" onsubmit="createProduct(event)">
      <input id="product-name" placeholder="Product name (e.g. Petrol)" required>
      <input id="product-code" placeholder="Code name (e.g. PMS)" maxlength="50" required>
      <label>Product color<input id="product-color" type="color" value="#1264d8" required></label>
      <button class="primary">Add product</button>
    </form>
    <div id="products"></div>
  </div>

  <div id="product-edit-modal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" onclick="closeProductEdit()"></div>
    <form id="product-edit-form" class="modal-card form" onsubmit="saveProductEdit(event)">
      <div class="top"><h3>Edit Product</h3><button type="button" class="modal-close" onclick="closeProductEdit()" aria-label="Close">×</button></div>
      <input id="edit-product-id" type="hidden">
      <label>Product name<input id="edit-product-name" required></label>
      <label>Code name<input id="edit-product-code" maxlength="50" required></label>
      <label>Product color<input id="edit-product-color" type="color" required></label>
      <div class="row">
        <button type="submit" class="primary">Save Changes</button>
        <button type="button" onclick="closeProductEdit()">Cancel</button>
      </div>
    </form>
  </div>

  <div class="card">
    <h3>Fuel Tanks</h3>
    <form class="form" onsubmit="createTank(event)">
      <input id="tank-code" placeholder="Tank code (e.g. T1)" required>
      <select id="tank-product" required><option value="">Select product</option></select>
      <input id="tank-capacity" type="number" min="1" step="0.01" placeholder="Capacity (liters)" required>
      <input id="tank-current" type="number" min="0" step="0.01" placeholder="Current fuel (liters)" value="0" required>
      <input id="tank-mm" type="number" min="0" step="0.01" placeholder="Current dip (mm)" value="0">
      <button class="primary">Add tank</button>
    </form>
    <div id="tanks"></div>
  </div>

  <div class="card">
    <h3>Fuel Nozzles</h3>
    <form class="form" onsubmit="createNozzle(event)">
      <input id="nozzle-code" placeholder="Nozzle code (e.g. N1)" required>
      <select id="nozzle-product" required><option value="">Select product</option></select>
      <select id="nozzle-tank" required><option value="">Select tank</option></select>
      <button class="primary">Add nozzle</button>
    </form>
    <div id="nozzles"></div>
  </div>

  <div class="card">
    <h3>Shift Assignment</h3>
    <form class="form" onsubmit="createShift(event)">
      <select id="shift-employee" required><option value="">Select employee</option></select>
      <select id="shift-nozzle" required><option value="">Select nozzle</option></select>
      <button class="primary">Assign Shift</button>
    </form>
    <div id="shifts"></div>
  </div>

  <div id="settings-status" class="muted"></div>
</main>
<script src="assets/app.js"></script>
</body>
</html>
