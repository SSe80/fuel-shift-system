<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Login</title>
  <link rel="manifest" href="/admin-manifest.webmanifest">
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Fuel Admin">
  <link rel="icon" href="/icons/admin-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    :root {
      --accent: #3182ce;
      --accent-dark: #2468a8;
      --bg: #ffffff;
      --card: #ffffff;
      --input: #ffffff;
      --border: #1e3550;
      --text: #172033;
      --muted: #667085;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 0%, rgba(49,130,206,.18), transparent 38%),
        linear-gradient(145deg, #050c16 0%, var(--bg) 55%, #0b1727 100%);
      color: var(--text);
      font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .login-page {
      min-height: 100vh;
      width: min(100% - 32px, 460px);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      width: 100%;
      padding: 42px 36px 34px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: 0 24px 65px rgba(0,0,0,.42);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 34px;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: rgba(49,130,206,.13);
      border: 1px solid rgba(49,130,206,.35);
      color: var(--accent);
      font-size: 20px;
      font-weight: 800;
    }

    .brand-name {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .8px;
      text-transform: uppercase;
      color: #344054;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
      line-height: 1.15;
      letter-spacing: -.6px;
    }

    .subtitle {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .form {
      display: grid;
      gap: 14px;
    }

    .field {
      position: relative;
    }

    input {
      width: 100%;
      height: 54px;
      padding: 0 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      background: var(--input);
      color: var(--text);
      font: inherit;
      transition: border-color .2s, box-shadow .2s;
    }

    input::placeholder { color: #98a2b3; }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(49,130,206,.14);
    }

    button {
      width: 100%;
      height: 54px;
      margin-top: 4px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(49,130,206,.24);
      transition: transform .15s, filter .15s;
    }

    button:hover { filter: brightness(1.08); }
    button:active { transform: translateY(1px); }

    .install-button { display: none; margin-top: 12px; background: #172033; box-shadow: none; }

    .hint {
      margin: 22px 0 0;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    .back {
      display: block;
      margin-top: 22px;
      color: #8fb9e5;
      font-size: 13px;
      text-align: center;
      text-decoration: none;
    }

    .back:hover { color: white; }

    .toast { margin-top: 12px; }

    @media (max-width: 520px) {
      .login-card { padding: 34px 24px 28px; border-radius: 18px; }
    }
  </style>
</head>
<body>
  <main class="login-page">
    <section class="login-card">
      <div class="brand">
        <div class="brand-mark">A</div>
        <div class="brand-name">Fuel Shift System</div>
      </div>

      <h1>Admin sign in</h1>
      <p class="subtitle">Access station management, reports and administration tools.</p>

      <form id="login-form" class="form" data-role="admin">
        <input id="operator-id" placeholder="Operator ID (last 6 digits)" inputmode="numeric" autocomplete="username" required>
        <input id="pin" placeholder="PIN" type="password" inputmode="numeric" autocomplete="current-password" required>
        <button type="submit">Sign in</button>
      </form>

      <button type="button" id="install-app" class="install-button">Install Admin App</button>
      <p class="hint">Administrator access</p>
      <div id="toast" class="toast"></div>
    </section>
  </main>

  <script>
  let adminInstallPrompt = null;
  const adminInstallButton = document.getElementById("install-app");
  window.addEventListener("beforeinstallprompt", event => {
    event.preventDefault();
    adminInstallPrompt = event;
    adminInstallButton.style.display = "block";
  });
  adminInstallButton.addEventListener("click", async () => {
    if (!adminInstallPrompt) return;
    adminInstallPrompt.prompt();
    await adminInstallPrompt.userChoice;
    adminInstallPrompt = null;
    adminInstallButton.style.display = "none";
  });
  window.addEventListener("appinstalled", () => {
    adminInstallButton.style.display = "none";
    adminInstallPrompt = null;
  });
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("/service-worker.js").catch(error => console.error("Service worker registration failed:", error)));
  }
</script>
<script src="assets/login.js?v=20261015-persistent-role1"></script>
<script src="assets/popup-portal.js?v=20261015-persistent-role1"></script>
</body>
</html>
