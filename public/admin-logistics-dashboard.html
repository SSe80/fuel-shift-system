r:1px solid rgba(245,158,11,.35);display:grid;place-items:center;color:var(--accent);font-weight:900;letter-spacing:-1px}.brand strong{display:block;font-size:15px;letter-spacing:.5px}.brand small{display:block;color:var(--muted);margin-top:4px}.card{border:1px solid var(--line);border-radius:14px}.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase}h1{font-size:clamp(30px,5vw,44px);letter-spacing:-1.2px;margin:9px 0 10px}.intro{color:var(--muted);max-width:650px;line-height:1.65;margin:0 0 28px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:28px 0 14px}.section-head h2{font-size:17px;margin:0}.section-head p{font-size:12px;color:var(--muted);margin:6px 0 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{display:block;background:linear-gradient(145deg,var(--panel),#f8fbff);box-shadow:0 6px 22px rgba(15,23,42,.06);padding:20px;min-height:154px}.icon{width:38px;height:38px;border-radius:11px;background:var(--panel2);display:grid;place-items:center;font-size:19px;margin-bottom:16px}.card h3{font-size:15px;margin:0 0 7px}.card p{font-size:13px;color:var(--muted);line-height:1.55;margin:0}.arrow{color:var(--accent);font-size:18px;float:right}.note{margin-top:24px;padding:15px 17px;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:12px;line-height:1.6}.note strong{color:#667085}@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.shell{padding:20px 15px 32px}}@media(max-width:480px){.grid{grid-template-columns:1fr}.card{min-height:130px}.top{margin-bottom:26px}.section-head{align-items:start;flex-direction:column}}

<style id="logistics-admin-theme">
/* Match the main Admin panel's sidebar, workspace, cards, and responsive layout. */
body{background:#f7f9fc!important;color:#182230!important;font-family:Inter,"Segoe UI",Arial,sans-serif!important}
.app-layout{display:flex!important;min-height:100vh}
.sidebar{position:sticky!important;top:0!important;align-self:flex-start!important;width:244px!important;min-width:244px!important;height:100vh!important;min-height:100vh!important;padding:24px 14px!important;display:flex!important;flex-direction:column!important;align-items:stretch!important;gap:0!important;background:#fff!important;color:#182230!important;border:0!important;border-right:1px solid #dce5ef!important;box-shadow:none!important;overflow-y:auto!important}
.side-brand{flex:0 0 auto!important;padding:0 10px 24px!important;border-bottom:1px solid #dce5ef!important;color:#182230!important}
.side-brand small{color:#667085!important}
.side-mark{background:#fff7ed!important;border:1px solid #fed7aa!important;color:#b45309!important}
.side-nav{flex:1 1 auto!important;width:100%!important;min-width:0!important;display:grid!important;align-items:stretch!important;justify-content:stretch!important;gap:6px!important;padding:18px 0 0!important;overflow:visible!important}
.side-nav a{display:flex!important;flex:0 0 auto!important;white-space:nowrap!important;color:#475467!important;padding:12px 13px!important;border-radius:10px!important;font-size:13px!important}
.side-nav a:hover,.side-nav a.active{background:#eff6ff!important;color:#1d4ed8!important}
.side-nav .nav-icon{display:inline-block!important;font-size:17px!important}
.sidebar-logout{flex:0 0 auto!important;width:100%!important;margin:auto 0 0!important;padding:12px 14px!important;background:#fff!important;border:1px solid #fecaca!important;border-radius:9px!important;color:#b91c1c!important;white-space:nowrap}
.main-area{flex:1 1 auto!important;width:auto!important;min-width:0!important}
.shell{width:100%!important;max-width:1180px!important;margin:0 auto!important;padding:28px 22px 44px!important}
.top{padding-bottom:18px;border-bottom:1px solid #e5eaf1;margin-bottom:26px!important}
.brand .mark{background:#fff7ed;border-color:#fed7aa;color:#b45309}
.card,.delivery-record{border-color:#e1e8f0!important;border-radius:16px!important;box-shadow:0 5px 20px #0f172a08!important}
.delivery-product-picker{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px;margin-top:2px}
.delivery-product-choice{position:relative;display:flex;align-items:center;gap:10px;min-width:0;min-height:58px;padding:12px;border:1px solid #d0d9e5;border-radius:12px;background:#fff;color:#182230;text-align:left;font:inherit;cursor:pointer;transition:border-color .15s,background .15s,box-shadow .15s}
.delivery-product-choice:hover{border-color:#93b4e8;background:#f8fbff}
.delivery-product-choice[aria-checked="true"]{border-color:#2563eb;background:#eff6ff;box-shadow:inset 0 0 0 1px #2563eb}
.delivery-product-choice:focus-visible{outline:3px solid #bfdbfe;outline-offset:2px}
.delivery-product-swatch{width:14px;height:34px;flex:0 0 14px;border:1px solid #98a2b3;border-radius:5px;background:var(--product-color,#1264d8)}
.delivery-product-copy{display:flex;flex-direction:row;align-items:center;flex-wrap:wrap;gap:6px;min-width:0}
.delivery-product-name{font-size:13px;font-weight:800;overflow-wrap:anywhere}
.delivery-product-code{display:inline-flex;align-items:center;flex:0 0 auto;padding:3px 6px;border:1px solid #dce5ef;border-radius:6px;background:#f8fafc;font-size:10px;font-weight:800;color:#475467;letter-spacing:.02em}
.delivery-product-choice[aria-checked="true"] .delivery-product-code{border-color:#bfdbfe;background:#fff;color:#1d4ed8}
.delivery-product-picker-empty{grid-column:1/-1;padding:12px;border:1px dashed #cbd5e1;border-radius:10px;color:#667085;font-size:12px}
@media(max-width:760px){.app-layout{display:block!important}.sidebar{position:relative!important;top:auto!important;width:100%!important;min-width:0!important;height:auto!important;min-height:0!important;padding:12px!important;display:flex!important;flex-direction:column!important;gap:0!important;border-right:0!important;border-bottom:1px solid #dce5ef!important}.side-brand{padding:0 6px 12px!important}.side-nav{display:flex!important;overflow-x:auto!important;padding-top:10px!important;gap:4px!important}.side-nav a{white-space:nowrap!important;padding:11px!important;font-size:12px!important}.side-nav .nav-icon{display:none!important}.sidebar-logout{align-self:flex-end!important;width:auto!important;margin:10px 0 0!important;padding:9px 12px!important}.shell{padding:20px 15px 32px!important}.top{margin-bottom:24px!important}}
@media(max-width:520px){.delivery-grid{grid-template-columns:1fr}.delivery-wide{grid-column:auto}.delivery-stats{grid-template-columns:1fr 1fr}.delivery-record-head{align-items:start}.delivery-product-picker{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.delivery-product-choice{padding:10px;min-height:54px;gap:8px}.delivery-product-name{font-size:12px}.delivery-product-code{font-size:9px;padding:3px 5px}}
@media(max-width:380px){.delivery-product-picker{grid-template-columns:1fr}}
</style>
