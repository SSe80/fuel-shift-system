<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827">
<title>Admin Logistics Dashboard</title>
<style>
:root{color-scheme:light;--bg:#f3f6fb;--panel:#ffffff;--panel2:#eef4fb;--line:#dce5ef;--text:#182230;--muted:#667085;--accent:#2563eb;--accent2:#1d4ed8}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% -15%,rgba(37,99,235,.09),transparent 42%),var(--bg);color:var(--text);font-family:Inter,"Segoe UI",Arial,sans-serif;min-height:100vh}
.app-layout{display:flex;min-height:100vh}.sidebar{width:244px;flex:0 0 244px;background:#fff;border-right:1px solid var(--line);padding:24px 14px;position:sticky;top:0;height:100vh}.side-brand{display:flex;align-items:center;gap:11px;padding:0 10px 24px;border-bottom:1px solid var(--line);font-weight:800;font-size:13px;letter-spacing:.5px}.side-mark{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:#fff7ed;border:1px solid #fed7aa;color:#b45309;font-weight:900}.side-brand small{display:block;color:var(--muted);font-weight:500;letter-spacing:0;margin-top:4px}.side-nav{display:grid;gap:6px;padding-top:18px}.side-nav a{display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:10px;color:#475467;text-decoration:none;font-size:13px;font-weight:650}.side-nav a:hover,.side-nav a.active{background:#eff6ff;color:#1d4ed8}.side-nav .nav-icon{width:22px;text-align:center;font-size:17px}.shell{max-width:1180px;margin:auto;padding:28px 22px 44px;width:100%;min-width:0}.main-area{flex:1;min-width:0}@media(max-width:760px){.app-layout{display:block}.sidebar{width:100%;height:auto;position:relative;padding:12px}.side-brand{padding-bottom:12px}.side-nav{display:flex;overflow-x:auto;padding-top:10px}.side-nav a{white-space:nowrap}.shell{padding:20px 15px 32px}}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:34px}.brand{display:flex;align-items:center;gap:12px}.mark{width:46px;height:46px;border-radius:14px;background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.35);display:grid;place-items:center;color:var(--accent);font-weight:900;letter-spacing:-1px}.brand strong{display:block;font-size:15px;letter-spacing:.5px}.brand small{display:block;color:var(--muted);margin-top:4px}.card{border:1px solid var(--line);border-radius:14px}.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase}h1{font-size:clamp(30px,5vw,44px);letter-spacing:-1.2px;margin:9px 0 10px}.intro{color:var(--muted);max-width:650px;line-height:1.65;margin:0 0 28px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:28px 0 14px}.section-head h2{font-size:17px;margin:0}.section-head p{font-size:12px;color:var(--muted);margin:6px 0 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{display:block;background:linear-gradient(145deg,var(--panel),#f8fbff);box-shadow:0 6px 22px rgba(15,23,42,.06);padding:20px;min-height:154px}.icon{width:38px;height:38px;border-radius:11px;background:var(--panel2);display:grid;place-items:center;font-size:19px;margin-bottom:16px}.card h3{font-size:15px;margin:0 0 7px}.card p{font-size:13px;color:var(--muted);line-height:1.55;margin:0}.arrow{color:var(--accent);font-size:18px;float:right}.note{margin-top:24px;padding:15px 17px;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:12px;line-height:1.6}.note strong{color:#667085}@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.shell{padding:20px 15px 32px}}@media(max-width:480px){.grid{grid-template-columns:1fr}.card{min-height:130px}.top{margin-bottom:26px}.section-head{align-items:start;flex-direction:column}}
</style>
</head>
<body>
<div class="app-layout"><aside class="sidebar" aria-label="Logistics navigation"><div class="side-brand"><span class="side-mark">AL</span><div>ADMIN LOGISTICS<small>Fuel Shift System</small></div></div><nav class="side-nav"><a href="admin-logistics-settings.html"><span class="nav-icon">⚙</span><span>Settings</span></a><a class="active" href="admin-logistics-dashboard.html"><span class="nav-icon">⌂</span><span>Dashboard</span></a></nav></aside><div class="main-area"><main class="shell">
<header class="top"><div class="brand"><div class="mark" aria-hidden="true">AL</div><div><strong>ADMIN LOGISTICS</strong><small>Fuel Shift System</small></div></div></header>

</main></div></div>
</body>
</html>
