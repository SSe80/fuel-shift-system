<!doctype html>
<html lang="en">
<head>
<link rel="manifest" href="/admin-manifest.webmanifest">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Dashboard | Admin Logistics</title>

<style>
:root{color-scheme:light;--lg-ink:#182230;--lg-muted:#667085;--lg-line:#dce5ef}
*{box-sizing:border-box}
body{margin:0;background:#f7f9fc;color:var(--lg-ink);font-family:Inter,"Segoe UI",Arial,sans-serif}
.logistics-layout{min-height:100vh;background:#f7f9fc}
.logistics-sidebar{position:relative;top:auto;width:100%;min-height:74px;padding:0 18px;display:flex;flex-direction:row;align-items:center;gap:18px;background:#111827;color:#e5e7eb;border:0;border-bottom:1px solid #253047;box-shadow:0 4px 18px #10182818}
.logistics-brand{display:flex;align-items:center;gap:10px;flex:0 0 auto;padding:0;border:0}
.logistics-mark{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:#1f2937;border:1px solid #374151;color:#fbbf24;font-weight:900}
.logistics-brand strong{display:block;color:#f9fafb;font-size:13px;letter-spacing:.4px}
.logistics-brand small{display:block;color:#9ca3af;font-size:11px;margin-top:4px}
.logistics-nav{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:5px;overflow-x:auto;scrollbar-width:none}
.logistics-nav::-webkit-scrollbar{display:none}
.logistics-nav a{display:flex;align-items:center;gap:9px;flex:0 0 auto;padding:12px 13px;border-radius:10px;color:#d1d5db;text-decoration:none;white-space:nowrap;font-size:14px;font-weight:650}
.logistics-nav a:hover,.logistics-nav a.active{background:#273449;color:#fff}
.logistics-nav a span{width:22px;text-align:center}
.logistics-logout{flex:0 0 auto;border:1px solid #7f1d1d;border-radius:9px;padding:11px 13px;background:#111827;color:#fecaca;font-size:13px;font-weight:750;cursor:pointer;white-space:nowrap}
.logistics-logout:disabled{opacity:.6}
.logistics-main{width:100%;min-width:0}
.logistics-main .wrap{max-width:1180px;margin:0 auto;padding:28px 22px 44px}
.page-header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:0 0 20px;margin:0 0 26px;border-bottom:1px solid #e5eaf1}
.page-heading{min-width:0}
.eyebrow{color:#2563eb;font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase}
h1{font-size:clamp(27px,4vw,36px);line-height:1.2;letter-spacing:-.8px;margin:8px 0 6px;color:#182230}
.page-description{margin:0;color:var(--lg-muted);font-size:13px;line-height:1.6}
@media(max-width:760px){.logistics-sidebar{min-height:64px;padding:0 10px;gap:8px}.logistics-brand{display:none}.logistics-nav{justify-content:flex-start;gap:4px}.logistics-nav a{padding:11px;font-size:12px}.logistics-nav a span{display:none}.logistics-logout{padding:10px;font-size:12px}.logistics-main .wrap{padding:20px 15px 32px}.page-header{align-items:flex-start;margin-bottom:20px}}
@media(max-width:480px){.logistics-sidebar{min-height:58px;padding:0 7px}.logistics-nav a{padding:10px;font-size:11px}.logistics-logout{padding:9px;font-size:11px}.logistics-main .wrap{padding:16px 12px 28px}}

/* Remove the blank strip created by the shared admin-shell top offset; logistics nav is in normal document flow. */
body.admin-shell{padding-top:0!important}
</style>
<script src="assets/logistics-auth.js?v=20261015-session-retry1"></script>
</head>
<body class="admin-shell admin-control-ui" data-app-page="adminLogisticsDashboard">
<div class="logistics-layout">
<aside class="logistics-sidebar" aria-label="Logistics navigation">
<div class="logistics-brand"><span class="logistics-mark">AL</span><div><strong>ADMIN LOGISTICS</strong><small>Fuel Shift System</small></div></div>
<nav class="logistics-nav" aria-label="Main navigation">
<a href="admin-logistics-dashboard.html" class="active" aria-current="page"><span aria-hidden="true">⌂</span><b>Dashboard</b></a>
<a href="admin-logistics-truck.html"><span aria-hidden="true">🚚</span><b>Truck</b></a>
<a href="admin-logistics-deliveries.html"><span aria-hidden="true">📦</span><b>Deliveries</b></a>
<a href="admin-logistics-settings.html"><span aria-hidden="true">⚙</span><b>Settings</b></a>
</nav>
<button class="logistics-logout" type="button" data-logistics-logout><span aria-hidden="true">↪</span> Log out</button>
</aside>
<div class="logistics-main">
<main class="wrap">
<header class="page-header">
<div class="page-heading">
<div class="eyebrow">ADMIN LOGISTICS</div>
<h1>Dashboard</h1>
<p class="page-description">Logistics workspace</p>
</div>
</header>
</main>
</div>
</div>
<script>
(function(){if("serviceWorker"in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("/service-worker.js").catch(function(e){console.error("Admin service worker registration failed:",e);});});var pe=null,b=null;window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();pe=e;if(!b){b=document.createElement("button");b.type="button";b.textContent="Install Admin App";b.setAttribute("aria-label","Install Fuel Shift System Admin app");b.style.cssText="position:fixed;z-index:99999;right:16px;bottom:16px;padding:12px 16px;border:0;border-radius:12px;background:#2563eb;color:#fff;font:700 13px Arial,sans-serif;box-shadow:0 5px 18px #0003;cursor:pointer";b.addEventListener("click",async function(){if(!pe)return;pe.prompt();await pe.userChoice;pe=null;b.remove();b=null;});document.body.appendChild(b);}});window.addEventListener("appinstalled",function(){if(b)b.remove();b=null;pe=null;});})();
</script>
</body>
</html>
